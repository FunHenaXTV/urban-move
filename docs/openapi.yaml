        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Faults & maintenance ─────────────────────────────
  /v1/faults:
    get:
      tags: [Faults & maintenance]
      operationId: listFaults
      summary: List faults
      description: "**Roles:** Technician, Coordinator (all); Hub operator (bikes at assigned hubs)."
      x-roles: [TECHNICIAN, OPS_COORDINATOR, HUB_OPERATOR]
      parameters:
        - { name: bike_id, in: query, schema: { type: string } }
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FaultStatus' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/FaultSeverity' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of faults
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Faults & maintenance]
      operationId: reportFault
      summary: Report a fault
      description: |
        **Roles:** Technician; Hub operator (bike at an assigned hub or in a rental checked in there); Coordinator.
        `CRITICAL` takes effect immediately in the same transaction: the bike leaves availability results and cannot be checked out.
        Future reservations are reassigned or flagged (see Fault lifecycle). Does not change any reservation, rental or charge record.
      x-roles: [TECHNICIAN, HUB_OPERATOR, OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaultCreate' }
            example: { bike_id: BIKE-402, severity: CRITICAL, category: BRAKES, description: Rear brake does not engage, attachment_ids: [ATT-80] }
      responses:
        '201':
          description: Fault recorded
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fault' }
              example:
                fault_id: FLT-301
                bike_id: BIKE-402
                severity: CRITICAL
                category: BRAKES
                description: Rear brake does not engage
                status: REPORTED
                reported_by: TEC-4
                reported_at: "2026-11-21T07:40:00Z"
                hub_id: HUB-02
                affected_reservation_ids: [RES-9950]
                bike_technical_status: CRITICAL_FAULT
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/faults/{faultId}:
    parameters:
      - $ref: '#/components/parameters/FaultId'
    get:
      tags: [Faults & maintenance]
      operationId: getFault
      summary: Get fault
      description: "**Roles:** Technician, Coordinator; Hub operator (assigned hubs)."
      x-roles: [TECHNICIAN, OPS_COORDINATOR, HUB_OPERATOR]
      responses:
        '200':
          description: Fault
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fault' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/faults/{faultId}/start-work:
    parameters:
      - $ref: '#/components/parameters/FaultId'
    post:
      tags: [Faults & maintenance]
      operationId: startFaultWork
      summary: "Transition REPORTED → IN_PROGRESS"
      description: "**Roles:** Technician. Assigns the fault to the caller."
      x-roles: [TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: In progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fault' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/faults/{faultId}/resolve:
    parameters:
      - $ref: '#/components/parameters/FaultId'
    post:
      tags: [Faults & maintenance]
      operationId: resolveFault
      summary: "Transition → RESOLVED"
      description: |
        **Roles:** Technician. Recalculates the bike's derived `technical_status` (other open faults, maintenance windows, blocks and battery still apply,
        so the bike is **not** automatically "available"). Has no effect on historical condition reports, rentals, invoices or disputes.
      x-roles: [TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaultResolve' }
            example: { resolution_type: FIXED, notes: Replaced rear brake cable and pads. }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/maintenance-windows:
    get:
      tags: [Faults & maintenance]
      operationId: listMaintenanceWindows
      summary: List maintenance windows
      description: "**Roles:** Technician, Coordinator; Hub operator (assigned hubs)."
      x-roles: [TECHNICIAN, OPS_COORDINATOR, HUB_OPERATOR]
      parameters:
        - { name: bike_id, in: query, schema: { type: string } }
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindowPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Faults & maintenance]
      operationId: scheduleMaintenance
      summary: Schedule a maintenance window
      description: |
        **Roles:** Technician, Coordinator. Writes an allocation for the bike (same exclusion constraint as reservations).
        Overlapping reservation/rental → `409 ALLOCATION_CONFLICT` listing them. Only a Coordinator may pass
        `displacement: REASSIGN_OR_CANCEL` (technicians cannot modify reservations → `403` if they try).
      x-roles: [TECHNICIAN, OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceWindowCreate' }
            example: { bike_id: BIKE-12, start: "2026-12-08T06:00:00Z", end: "2026-12-08T15:00:00Z", reason: Annual motor service }
      responses:
        '201':
          description: Scheduled
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Overlaps reservations/rentals/other windows
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.urbanmove.city/problems/allocation-conflict
                title: Allocation conflict
                status: 409
                code: ALLOCATION_CONFLICT
                detail: BIKE-12 has 1 reservation in the requested window. A coordinator can schedule with displacement.
                conflicting_reservation_ids: [RES-9970]
  /v1/maintenance-windows/{maintenanceWindowId}:
    parameters:
      - $ref: '#/components/parameters/MaintenanceWindowId'
    get:
      tags: [Faults & maintenance]
      operationId: getMaintenanceWindow
      summary: Get maintenance window
      description: "**Roles:** Technician, Coordinator; Hub operator (assigned hubs)."
      x-roles: [TECHNICIAN, OPS_COORDINATOR, HUB_OPERATOR]
      responses:
        '200':
          description: Window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/maintenance-windows/{maintenanceWindowId}/complete:
    parameters:
      - $ref: '#/components/parameters/MaintenanceWindowId'
    post:
      tags: [Faults & maintenance]
      operationId: completeMaintenance
      summary: "Transition SCHEDULED → COMPLETED (releases remaining time)"
