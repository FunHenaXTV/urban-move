      x-roles: [TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/maintenance-windows/{maintenanceWindowId}/cancel:
    parameters:
      - $ref: '#/components/parameters/MaintenanceWindowId'
    post:
      tags: [Faults & maintenance]
      operationId: cancelMaintenance
      summary: "Transition SCHEDULED → CANCELLED"
