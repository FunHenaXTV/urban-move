  # ───────────────────────────── Reservation requests ─────────────────────────────
  /v1/reservation-requests:
    get:
      tags: [Reservation requests]
      operationId: listReservationRequests
      summary: List recurring reservation requests
      description: "**Roles & scope:** Org member → requests of own organisation; Coordinator → all (filter by `status` for the approval inbox)."
      x-roles: [ORG_MEMBER, OPS_COORDINATOR]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReservationRequestStatus' } }
        - { name: organisation_id, in: query, schema: { type: string }, description: Coordinator only }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationRequestPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reservation requests]
      operationId: createReservationRequest
      summary: Submit a recurring reservation request
      description: |
        **Roles:** Org member (organisation taken from the token). Creates **no** reservations and allocates nothing until approval.
        Max 26 occurrences, max 10 bikes per occurrence.
      x-roles: [ORG_MEMBER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequestCreate' }
            example:
              pickup_hub_id: HUB-04
              planned_return_hub_id: HUB-04
              bike_count: 3
              requirements: { min_load_capacity_kg: 100 }
              equipment_per_bike: [ { equipment_type: DELIVERY_CRATE, quantity: 1 } ]
              recurrence: { frequency: WEEKLY, weekday: TUESDAY, start_local_time: "08:00", end_local_time: "12:00", time_zone: Europe/Berlin, first_date: "2026-11-24", occurrence_count: 6 }
              purpose: Food bank deliveries
      responses:
        '201':
          description: Submitted
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/reservation-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Reservation requests]
      operationId: getReservationRequest
      summary: Get request with fulfilment summary
      description: "**Roles & scope:** Org member of the owning organisation (else 404); Coordinator."
      x-roles: [ORG_MEMBER, OPS_COORDINATOR]
      responses:
        '200':
          description: Request
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reservation requests]
      operationId: amendReservationRequest
      summary: Edit a request (explicit effect on existing reservations)
      description: |
        **Roles:** Org member of the owning organisation.
        * `SUBMITTED`: edited in place (no reservations exist yet); `effective_from` is ignored.
        * `APPROVED`: requires `effective_from`. The request becomes `AMENDMENT_PENDING` and the amendment is stored in `pending_amendment`.
          **Existing reservations stay valid until a coordinator decides.** On approval, every `CONFIRMED` reservation of this request with
          start ≥ `effective_from` is cancelled (reason `ORGANISATION_REQUEST_CHANGE`, normal 24-hour fee rule) and new reservations are generated
          for the amended pattern; reservations before `effective_from` and collected ones are never touched. On rejection nothing changes.
        * Other states → `409 INVALID_STATE_TRANSITION`.
      x-roles: [ORG_MEMBER]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequestAmend' }
            example: { effective_from: "2026-12-15", bike_count: 2 }
      responses:
        '200':
          description: Amended (SUBMITTED) or amendment pending (APPROVED → AMENDMENT_PENDING)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/reservation-requests/{requestId}/occurrences:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Reservation requests]
      operationId: listOccurrences
      summary: List occurrences with their reservations and shortfalls
      description: "**Roles & scope:** Org member of owning organisation; Coordinator."
      x-roles: [ORG_MEMBER, OPS_COORDINATOR]
      responses:
        '200':
          description: Occurrences, chronological
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
              example:
                items:
                  - { occurrence_id: OCC-44-1, date: "2026-11-24", start: "2026-11-24T07:00:00Z", end: "2026-11-24T11:00:00Z", status: FULFILLED, bikes_requested: 3, bikes_allocated: 3, reservation_ids: [RES-1201, RES-1202, RES-1203], shortfall: [] }
                  - { occurrence_id: OCC-44-3, date: "2026-12-08", start: "2026-12-08T07:00:00Z", end: "2026-12-08T11:00:00Z", status: PARTIALLY_FULFILLED, bikes_requested: 3, bikes_allocated: 2, reservation_ids: [RES-1207, RES-1208], shortfall: [ { count: 1, reason: MAINTENANCE_WINDOW, reference: MW-55 } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/reservation-requests/{requestId}/feasibility:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Reservation requests]
      operationId: getRequestFeasibility
      summary: "Read model: dry-run of approval (allocates nothing)"
      description: "**Roles:** Coordinator; Org member of owning organisation. Computed now; may differ at approval time."
      x-roles: [OPS_COORDINATOR, ORG_MEMBER]
      responses:
        '200':
          description: Feasibility
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feasibility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/reservation-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Reservation requests]
      operationId: approveReservationRequest
      summary: "Approve request (SUBMITTED → APPROVED) or pending amendment (AMENDMENT_PENDING → APPROVED)"
      description: |
        **Roles:** Operations coordinator.
        In one transaction generates individual `CONFIRMED` reservations (origin `ORGANISATION_REQUEST`) using the same eligibility rules
        and allocation constraint as `POST /v1/reservations`. If any occurrence cannot be fully allocated and `allow_partial=false`
        → `409 PARTIAL_FULFILMENT_NOT_ACCEPTED`, nothing created, state unchanged. With `allow_partial=true` the response lists the shortfall (W4).
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestApproval' }
            example: { allow_partial: true, note: "Dec 8: 2 bikes only (maintenance)" }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalResult' }
              example:
                request_id: REQ-44
                status: APPROVED
                fulfilment: { occurrences_total: 6, bikes_requested_total: 18, reservations_created: 17, bikes_unfulfilled: 1 }
                occurrences_href: /v1/reservation-requests/REQ-44/occurrences
                unfulfilled:
                  - { occurrence_id: OCC-44-3, date: "2026-12-08", bikes_requested: 3, bikes_allocated: 2, shortfall: [ { count: 1, reason: MAINTENANCE_WINDOW, reference: MW-55 } ] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`PARTIAL_FULFILMENT_NOT_ACCEPTED` or `INVALID_STATE_TRANSITION`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.urbanmove.city/problems/partial-fulfilment-not-accepted
                title: Request cannot be fully fulfilled
                status: 409
                code: PARTIAL_FULFILMENT_NOT_ACCEPTED
                detail: 1 of 18 bikes cannot be allocated. Nothing was created. Approve with allow_partial=true or ask the organisation to amend.
                instance: /v1/reservation-requests/REQ-44/approve
                unfulfilled: [ { occurrence_id: OCC-44-3, date: "2026-12-08", bikes_requested: 3, bikes_allocated: 2, shortfall: [ { count: 1, reason: MAINTENANCE_WINDOW, reference: MW-55 } ] } ]
  /v1/reservation-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Reservation requests]
      operationId: rejectReservationRequest
      summary: "Reject request (SUBMITTED → REJECTED) or amendment (AMENDMENT_PENDING → APPROVED, unchanged)"
      description: "**Roles:** Operations coordinator. Reason required."
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
            example: { reason: Hub capacity reserved for city event in that period. }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/reservation-requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Reservation requests]
      operationId: cancelReservationRequest
      summary: Cancel/withdraw a request (explicit effect on existing reservations)
      description: |
        **Roles:** Org member of owning organisation; Coordinator.
        * `SUBMITTED` → `CANCELLED` (withdrawal; no reservations exist).
        * `APPROVED` / `AMENDMENT_PENDING` → `CANCELLED`: every `CONFIRMED` reservation of the request starting on/after `effective_from`
          is cancelled. Each one follows the normal fee rule (free > 24 h before start, otherwise fee unless `service_outage_id`).
          Reservations before `effective_from`, `CHECKED_OUT` reservations and running rentals are kept. The response lists every affected reservation and fee.
      x-roles: [ORG_MEMBER, OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCancellation' }
            example: { effective_from: "2026-12-08", comment: Programme ends early }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestCancellationResult' }
              example:
                request_id: REQ-44
                status: CANCELLED
                cancelled_reservations:
                  - { reservation_id: RES-1207, start: "2026-12-08T07:00:00Z", fee_minor: 0 }
                  - { reservation_id: RES-1208, start: "2026-12-08T07:00:00Z", fee_minor: 0 }
                kept_reservation_ids: [RES-1201, RES-1202, RES-1203, RES-1204, RES-1205, RES-1206]
                currency: EUR
                fee_invoice_id: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Billing ─────────────────────────────
  /v1/invoices:
    get:
      tags: [Billing]
      operationId: listInvoices
      summary: List invoices
      description: |
        **Roles & scope:** Resident → own; Org member → own + organisation's; Support agent → any (`customer_id` filter);
        Coordinator → organisation invoices (read-only). **Technician and Hub operator → 403.**
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT, OPS_COORDINATOR]
      parameters:
        - { name: customer_id, in: query, schema: { type: string }, description: Staff only }
        - { name: issued_from, in: query, schema: { type: string, format: date } }
        - { name: issued_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Billing]
      operationId: getInvoice
      summary: Get an immutable invoice (JSON or PDF)
      description: |
        **Roles & scope:** owner Resident / Org member (organisation invoice); Support agent; Coordinator (organisation invoices).
        Not owner → **404** (no existence leak). Technician/Hub operator → **403**.
        There is no `PUT`/`PATCH`/`DELETE` on invoices (`405`). `credit_notes` and `net_amount_minor` are derived from linked documents;
        the invoice content itself never changes. `ETag` is stable for the invoice content.
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT, OPS_COORDINATOR]
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
              example:
                invoice_id: INV-5011
                invoice_number: UM-2026-005011
                status: ISSUED
                customer: { type: RESIDENT, id: USR-1001 }
                source: { type: RENTAL, id: RNT-8812 }
                currency: EUR
                line_items:
                  - { line_item_id: LI-5011-1, type: BASE_DURATION, description: "Cargo bike, 4 h 25 min (9 × 30 min)", quantity: 9, unit_amount_minor: 250, amount_minor: 2250 }
                  - { line_item_id: LI-5011-2, type: EQUIPMENT, description: Child seat, quantity: 1, unit_amount_minor: 300, amount_minor: 300 }
                  - { line_item_id: LI-5011-3, type: EQUIPMENT, description: Rain cover, quantity: 1, unit_amount_minor: 200, amount_minor: 200 }
                  - { line_item_id: LI-5011-4, type: LATE_RETURN_FEE, description: "Late return, 90 min (3 × 30 min)", quantity: 3, unit_amount_minor: 500, amount_minor: 1500 }
                  - { line_item_id: LI-5011-5, type: DIFFERENT_HUB_FEE, description: "Return at HUB-02 instead of HUB-01", quantity: 1, unit_amount_minor: 800, amount_minor: 800 }
                total_minor: 5050
                issued_at: "2026-11-20T13:30:02Z"
                replaces_invoice_id: null
                credit_notes: [ { credit_note_id: CN-902, amount_minor: 750, line_item_id: LI-5011-4, dispute_id: DSP-301, issued_at: "2026-11-24T10:12:00Z" } ]
                net_amount_minor: 4300
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Role may never read invoices (e.g. Technician)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.urbanmove.city/problems/role-not-permitted
                title: Role not permitted
                status: 403
                code: ROLE_NOT_PERMITTED
                detail: Role TECHNICIAN has no access to billing documents.
                instance: /v1/invoices/INV-5011
        '404': { $ref: '#/components/responses/NotFound' }
        '406':
          description: Unsupported Accept header
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/invoices/{invoiceId}/credit-notes:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Billing]
      operationId: issueCreditNote
      summary: Issue a goodwill/correction credit note without a dispute
      description: |
        **Roles:** Support agent only. Never modifies the invoice. Sum of credit notes ≤ invoice total (`422 CREDIT_EXCEEDS_INVOICE`).
        For a completely wrong invoice: credit the full amount and create a replacement invoice (`replacement` block); the
        replacement carries `replaces_invoice_id`. Disputed charges should be credited via `/v1/disputes/{id}/resolve` instead.
      x-roles: [SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditNoteCreate' }
            example: { amount_minor: 800, line_item_id: LI-5011-5, reason: Return hub was closed (OUT-17), settlement: ACCOUNT_CREDIT }
      responses:
        '201':
          description: Credit note issued
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/credit-notes/{creditNoteId}:
    parameters:
      - { name: creditNoteId, in: path, required: true, schema: { type: string }, example: CN-902 }
    get:
      tags: [Billing]
      operationId: getCreditNote
      summary: Get an immutable credit note
      description: "**Roles & scope:** as the referenced invoice (owner → else 404; Technician → 403)."
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT, OPS_COORDINATOR]
      responses:
        '200':
          description: Credit note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditNote' }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Disputes ─────────────────────────────
  /v1/disputes:
    get:
      tags: [Disputes]
      operationId: listDisputes
      summary: List disputes
      description: "**Roles & scope:** Resident / Org member → own; Support agent → all (work queue, filter `status`)."
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DisputeStatus' } }
        - { name: invoice_id, in: query, schema: { type: string } }
        - { name: assigned_to, in: query, schema: { type: string }, description: Support only }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Disputes]
      operationId: openDispute
      summary: Dispute a charge on an own invoice
      description: |
        **Roles:** Resident / Org member who can read the invoice (else 404). One open dispute per line item; within 60 days of issue.
      x-roles: [RESIDENT, ORG_MEMBER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeCreate' }
            example:
              invoice_id: INV-5011
              line_item_id: LI-5011-4
              disputed_amount_minor: 1500
              reason_code: LATE_FEE_INCORRECT
              explanation: I queued 40 minutes at HUB-02 before check-in.
              attachment_ids: []
      responses:
        '201':
          description: Dispute opened
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`DISPUTE_ALREADY_OPEN`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`AMOUNT_EXCEEDS_LINE`, `DISPUTE_WINDOW_CLOSED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/disputes/{disputeId}:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    get:
      tags: [Disputes]
      operationId: getDispute
      summary: Get dispute
      description: "**Roles & scope:** owner (else 404); Support agent."
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT]
      responses:
        '200':
          description: Dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/disputes/{disputeId}/start-review:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Disputes]
      operationId: startDisputeReview
      summary: "Transition OPEN → UNDER_REVIEW (assigns to caller)"
      description: "**Roles:** Support agent."
      x-roles: [SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Under review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/disputes/{disputeId}/resolve:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Disputes]
      operationId: resolveDispute
      summary: "Transition UNDER_REVIEW → RESOLVED; issues a credit note for any accepted amount"
      description: |
        **Roles:** Support agent (the assigned one). `ACCEPTED` → credit = disputed amount; `PARTIALLY_ACCEPTED` → 0 < credit < disputed;
        `REJECTED` → no credit. The invoice is **not** modified; a `CreditNote` is created in the same transaction (W5).
      x-roles: [SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeResolve' }
            example: { decision: PARTIALLY_ACCEPTED, credit_amount_minor: 750, settlement: REFUND_TO_PAYMENT_METHOD, note: "Queue delay of 30 min verified; remaining 60 min late fee stands." }
      responses:
        '200':
          description: Resolved
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
              example:
                dispute_id: DSP-301
                invoice_id: INV-5011
                line_item_id: LI-5011-4
                status: RESOLVED
                reason_code: LATE_FEE_INCORRECT
                explanation: I queued 40 minutes at HUB-02 before check-in.
                disputed_amount_minor: 1500
                currency: EUR
                opened_by: USR-1001
                opened_at: "2026-11-21T08:30:00Z"
                assigned_to: SUP-3
                resolution:
                  decision: PARTIALLY_ACCEPTED
                  credited_amount_minor: 750
                  credit_note_id: CN-902
                  settlement: REFUND_TO_PAYMENT_METHOD
                  note: Queue delay of 30 min verified; remaining 60 min late fee stands.
                  resolved_by: SUP-3
                  resolved_at: "2026-11-24T10:12:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: "`CREDIT_AMOUNT_INCONSISTENT` (e.g. PARTIALLY_ACCEPTED with credit ≥ disputed)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/disputes/{disputeId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Disputes]
      operationId: withdrawDispute
      summary: "Transition OPEN/UNDER_REVIEW → WITHDRAWN"
      description: "**Roles:** dispute owner."
      x-roles: [RESIDENT, ORG_MEMBER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "OIDC access token. Claims: sub, roles[], organisation_id, assigned_hub_ids[]."

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, one per user intent, reused on retries. Stored 24 h.
      schema: { type: string, format: uuid }
      example: 7b9e2a41-3d6f-4c81-a9e0-112233445566
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET; mismatch → 412, missing → 428.
      schema: { type: string }
      example: '"3"'
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`.
      schema: { type: string }
    HubId:
      { name: hubId, in: path, required: true, schema: { type: string }, example: HUB-01 }
    BikeId:
      { name: bikeId, in: path, required: true, schema: { type: string }, example: BIKE-402 }
    EquipmentId:
      { name: equipmentId, in: path, required: true, schema: { type: string }, example: EQ-RAIN-02 }
    ReservationId:
      { name: reservationId, in: path, required: true, schema: { type: string }, example: RES-9901 }
    RentalId:
      { name: rentalId, in: path, required: true, schema: { type: string }, example: RNT-8812 }
    FaultId:
      { name: faultId, in: path, required: true, schema: { type: string }, example: FLT-301 }
    MaintenanceWindowId:
      { name: maintenanceWindowId, in: path, required: true, schema: { type: string }, example: MW-55 }
    BlockId:
      { name: blockId, in: path, required: true, schema: { type: string }, example: BLK-9 }
    RequestId:
      { name: requestId, in: path, required: true, schema: { type: string }, example: REQ-44 }
    InvoiceId:
      { name: invoiceId, in: path, required: true, schema: { type: string }, example: INV-5011 }
    DisputeId:
      { name: disputeId, in: path, required: true, schema: { type: string }, example: DSP-301 }

  headers:
    Location:
      description: URI of the created resource
      schema: { type: string, format: uri-reference }
    ETag:
      description: Version tag for optimistic concurrency
      schema: { type: string }
    Link:
      description: 'RFC 8288 pagination links, e.g. `</v1/reservations?cursor=abc>; rel="next"`'
      schema: { type: string }
    IdempotentReplayed:
      description: "`true` when the response is a replay of a stored idempotent result"
      schema: { type: boolean }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.urbanmove.city/problems/validation-failed
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            detail: 2 fields are invalid.
            instance: /v1/reservations
            errors:
              - { field: end, code: MUST_BE_AFTER_START, message: end must be after start }
              - { field: "equipment_ids[1]", code: DUPLICATE, message: EQ-RAIN-02 listed twice }
    Unauthorized:
      description: Missing or invalid token
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/unauthenticated, title: Unauthenticated, status: 401, code: UNAUTHENTICATED }
    Forbidden:
      description: "Role not permitted (`ROLE_NOT_PERMITTED`) or hub not assigned (`HUB_NOT_ASSIGNED`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/role-not-permitted, title: Role not permitted, status: 403, code: ROLE_NOT_PERMITTED, detail: Your role cannot perform this operation. }
    NotFound:
      description: Not found or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/not-found, title: Not found, status: 404, code: NOT_FOUND, detail: Invoice INV-5011 was not found. }
    Conflict:
      description: Conflicts with current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/invalid-state-transition, title: Invalid state transition, status: 409, code: INVALID_STATE_TRANSITION, detail: Dispute DSP-301 is RESOLVED; resolve is only allowed from UNDER_REVIEW., current_state: RESOLVED }
    PreconditionFailed:
      description: ETag mismatch
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/etag-mismatch, title: Resource changed, status: 412, code: ETAG_MISMATCH, detail: Reload the resource and retry. }
    PreconditionRequired:
      description: If-Match missing
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/if-match-required, title: If-Match required, status: 428, code: IF_MATCH_REQUIRED }
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: https://api.urbanmove.city/problems/business-rule-violation, title: Business rule violation, status: 422, code: BUSINESS_RULE_VIOLATION, detail: The requested change violates a business rule. }

  schemas:
    # ── common ──
    Problem:
      type: object
      description: RFC 9457 problem details with UrbanMove extensions.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
      additionalProperties: true
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    CustomerRef:
      type: object
      properties:
        type: { type: string, enum: [RESIDENT, ORGANISATION] }
        id: { type: string }
    Requirements:
      type: object
      properties:
        min_load_capacity_kg: { type: integer, minimum: 0 }
        accessibility_features: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        min_range_km: { type: integer, minimum: 0 }
    EquipmentRef:
      type: object
      properties:
        equipment_id: { type: string }
        equipment_type: { $ref: '#/components/schemas/EquipmentType' }

    # ── enums ──
    HubStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    BikeType: { type: string, enum: [LONG_JOHN, LONGTAIL, TRIKE, HEAVY_TRIKE] }
    AccessibilityFeature: { type: string, enum: [STEP_THROUGH_FRAME, LOW_LOADING_DECK, TRICYCLE_STABILITY, HAND_CONTROLS, LOW_SEAT] }
    TechnicalStatus:
      type: string
      description: Derived, read-only.
      enum: [OPERATIONAL, CRITICAL_FAULT, IN_MAINTENANCE, RETIRED]
    UnavailabilityReason: { type: string, enum: [OPEN_CRITICAL_FAULT, MAINTENANCE_WINDOW, LOW_BATTERY, OPERATIONAL_BLOCK, IN_RENTAL, RESERVED, RETIRED] }
    EquipmentType: { type: string, enum: [CHILD_SEAT, RAIN_COVER, DELIVERY_CRATE, CARGO_NET] }
    EquipmentStatus: { type: string, enum: [AVAILABLE, IN_USE, DAMAGED, MISSING, RETIRED] }
    ReservationStatus: { type: string, enum: [CONFIRMED, CHECKED_OUT, EXPIRED, CANCELLED] }
    RentalStatus: { type: string, enum: [ACTIVE, OVERDUE, RETURNED] }
    RentalFlag: { type: string, enum: [LATE_RETURN, DIFFERENT_RETURN_HUB, EQUIPMENT_DAMAGED, EQUIPMENT_MISSING, BIKE_DAMAGED, SUBSTITUTE_BIKE] }
    FaultStatus: { type: string, enum: [REPORTED, IN_PROGRESS, RESOLVED] }
    FaultSeverity: { type: string, enum: [CRITICAL, MAJOR, MINOR] }
    ReservationRequestStatus: { type: string, enum: [SUBMITTED, APPROVED, AMENDMENT_PENDING, REJECTED, CANCELLED, COMPLETED] }
    DisputeStatus: { type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED, WITHDRAWN] }
    Displacement:
      type: string
      enum: [NONE, REASSIGN_OR_CANCEL]
      default: NONE
      description: "`REASSIGN_OR_CANCEL` only for OPS_COORDINATOR."

    # ── profile ──
    Me:
      type: object
      properties:
        user_id: { type: string, example: USR-1001 }
        display_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        roles: { type: array, items: { type: string } }
        organisation_id: { type: string, nullable: true }
        assigned_hub_ids: { type: array, items: { type: string } }
        active_reservation_count: { type: integer, description: "Personal CONFIRMED reservations (max 2)" }
    MePatch:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 30 }
    Attachment:
      type: object
      properties:
        attachment_id: { type: string, example: ATT-77 }
        content_type: { type: string }
        size_bytes: { type: integer }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        href: { type: string }
    Organisation:
      type: object
      properties:
        organisation_id: { type: string }
        name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string }
              display_name: { type: string }

    # ── hubs & fleet ──
    Hub:
      type: object
      properties:
        hub_id: { type: string }
        name: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        status: { $ref: '#/components/schemas/HubStatus' }
        opening_hours: { type: string }
        parking_slots: { type: integer }
        created_at: { type: string, format: date-time }
    HubCreate:
      type: object
      required: [name, address, location]
      properties:
        name: { type: string, maxLength: 100 }
        address: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        opening_hours: { type: string }
        parking_slots: { type: integer, minimum: 1 }
    HubPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        opening_hours: { type: string }
        parking_slots: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/HubStatus' }
    HubPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Hub' } }
        next_cursor: { type: string, nullable: true }
    Bike:
      type: object
      properties:
        bike_id: { type: string }
        bike_type: { $ref: '#/components/schemas/BikeType' }
        model: { type: string }
        load_capacity_kg: { type: integer }
        accessibility_features: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        battery_pct: { type: integer, minimum: 0, maximum: 100, readOnly: true }
        estimated_range_km: { type: integer, readOnly: true }
        current_hub_id: { type: string, nullable: true, description: null while rented }
        technical_status: { $ref: '#/components/schemas/TechnicalStatus' }
        bookable_now: { type: boolean, readOnly: true }
        unavailability_reasons: { type: array, items: { $ref: '#/components/schemas/UnavailabilityReason' } }
        open_fault_ids: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    BikeCreate:
      type: object
      required: [bike_type, model, load_capacity_kg, hub_id]
      properties:
        bike_type: { $ref: '#/components/schemas/BikeType' }
        model: { type: string }
        load_capacity_kg: { type: integer, minimum: 1 }
        accessibility_features: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        hub_id: { type: string }
    BikePatch:
      type: object
      minProperties: 1
      properties:
        model: { type: string }
        load_capacity_kg: { type: integer, minimum: 1 }
        accessibility_features: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        hub_id: { type: string, description: Relocation }
        retired: { type: boolean }
    BikePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Bike' } }
        next_cursor: { type: string, nullable: true }
    Equipment:
      type: object
      properties:
        equipment_id: { type: string }
        equipment_type: { $ref: '#/components/schemas/EquipmentType' }
        label: { type: string }
        hub_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EquipmentStatus' }
        updated_at: { type: string, format: date-time }
    EquipmentCreate:
      type: object
      required: [equipment_type, hub_id]
      properties:
        equipment_type: { $ref: '#/components/schemas/EquipmentType' }
        hub_id: { type: string }
        label: { type: string }
    EquipmentPatch:
      type: object
      minProperties: 1
      properties:
        hub_id: { type: string }
        status: { type: string, enum: [AVAILABLE, RETIRED] }
        label: { type: string }
    EquipmentPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Equipment' } }
        next_cursor: { type: string, nullable: true }

    # ── availability views ──
    HubAvailabilitySummary:
      type: object
      properties:
        hub_id: { type: string }
        name: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        distance_km: { type: number }
        window:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        bikes_available:
          type: array
          items:
            type: object
            properties:
              bike_type: { $ref: '#/components/schemas/BikeType' }
              count: { type: integer }
        equipment_available:
          type: array
          items:
            type: object
            properties:
              equipment_type: { $ref: '#/components/schemas/EquipmentType' }
              count: { type: integer }
    HubAvailabilitySummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HubAvailabilitySummary' } }
        next_cursor: { type: string, nullable: true }
    EligibleBikesResult:
      type: object
      properties:
        hub_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        is_binding: { type: boolean, enum: [false] }
        generated_at: { type: string, format: date-time }
        bikes:
          type: array
          items:
            type: object
            properties:
              bike_id: { type: string }
              bike_type: { $ref: '#/components/schemas/BikeType' }
              model: { type: string }
              load_capacity_kg: { type: integer }
              accessibility_features: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
              battery_pct: { type: integer }
              estimated_range_km: { type: integer }
              price_estimate_minor: { type: integer }
              currency: { type: string }
        equipment: { type: array, items: { $ref: '#/components/schemas/EquipmentRef' } }

    # ── reservations ──
    ReservationCreate:
      type: object
      required: [bike_id, pickup_hub_id, start, end]
      properties:
        bike_id: { type: string }
        pickup_hub_id: { type: string }
        planned_return_hub_id: { type: string, description: Defaults to pickup hub }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        equipment_ids: { type: array, maxItems: 4, uniqueItems: true, items: { type: string } }
        requirements: { $ref: '#/components/schemas/Requirements' }
    Reservation:
      type: object
      properties:
        reservation_id: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        origin: { type: string, enum: [INDIVIDUAL, ORGANISATION_REQUEST] }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        booked_by: { type: string }
        request_id: { type: string, nullable: true }
        occurrence_id: { type: string, nullable: true }
        bike_id: { type: string }
        pickup_hub_id: { type: string }
        planned_return_hub_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        collect_by: { type: string, format: date-time, description: start + 15 min }
        free_cancellation_until: { type: string, format: date-time }
        equipment: { type: array, items: { $ref: '#/components/schemas/EquipmentRef' } }
        requirements: { $ref: '#/components/schemas/Requirements' }
        rental_id: { type: string, nullable: true }
        cancellation:
          type: object
          nullable: true
          properties:
            cancelled_at: { type: string, format: date-time }
            cancelled_by: { type: string }
            reason: { type: string, enum: [CUSTOMER_REQUEST, SERVICE_OUTAGE, ORGANISATION_REQUEST_CHANGE, OPERATIONAL_DISPLACEMENT] }
            late: { type: boolean }
            service_outage_id: { type: string, nullable: true }
            fee_minor: { type: integer }
            currency: { type: string }
            fee_invoice_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        links: { type: object, additionalProperties: { type: string } }
    ReservationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Reservation' } }
        next_cursor: { type: string, nullable: true }
    ReservationCancel:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [CUSTOMER_REQUEST, SERVICE_OUTAGE] }
        service_outage_id: { type: string, description: Required when reason = SERVICE_OUTAGE }
        comment: { type: string, maxLength: 500 }
    AllowedAction:
      type: object
      properties:
        action: { type: string, enum: [CANCEL, EXTEND_RENTAL, OPEN_DISPUTE, VIEW_INVOICE] }
        method: { type: string }
        href: { type: string }
        fee_preview_minor: { type: integer, nullable: true }
        note: { type: string }
    Charges:
      type: object
      properties:
        currency: { type: string }
        estimated_total_minor: { type: integer, nullable: true, description: While the rental is running }
        invoices:
          type: array
          items:
            type: object
            properties:
              invoice_id: { type: string }
              total_minor: { type: integer }
              net_amount_minor: { type: integer }
              issued_at: { type: string, format: date-time }
        credit_notes: { type: array, items: { $ref: '#/components/schemas/CreditNoteSummary' } }
        open_dispute_ids: { type: array, items: { type: string } }
    ReservationDetail:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          properties:
            bike:
              type: object
              properties:
                bike_id: { type: string }
                bike_type: { $ref: '#/components/schemas/BikeType' }
                model: { type: string }
                load_capacity_kg: { type: integer }
            rental:
              type: object
              nullable: true
              properties:
                rental_id: { type: string }
                status: { $ref: '#/components/schemas/RentalStatus' }
                started_at: { type: string, format: date-time }
                due_at: { type: string, format: date-time }
                returned_at: { type: string, format: date-time, nullable: true }
                return_hub_id: { type: string, nullable: true }
                flags: { type: array, items: { $ref: '#/components/schemas/RentalFlag' } }
            condition_reports: { type: array, items: { $ref: '#/components/schemas/ConditionReport' } }
            charges: { $ref: '#/components/schemas/Charges' }
            allowed_actions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }

    # ── rentals ──
    IdentityCheck:
      type: object
      required: [method, verified]
      properties:
        method: { type: string, enum: [ID_CARD, PASSPORT, DRIVING_LICENCE, RESIDENCE_PERMIT, APP_QR] }
        verified: { type: boolean, description: Must be true }
        document_reference_last4: { type: string, maxLength: 4, description: No full document numbers are stored }
    ConditionReportInput:
      type: object
      required: [battery_pct, bike_condition, equipment]
      properties:
        battery_pct: { type: integer, minimum: 0, maximum: 100 }
        bike_condition: { type: string, enum: [GOOD, MINOR_WEAR, DAMAGED] }
        notes: { type: string, maxLength: 2000 }
        attachment_ids: { type: array, items: { type: string } }
        equipment:
          type: array
          description: Every rented equipment item must be listed
          items:
            type: object
            required: [equipment_id, status]
            properties:
              equipment_id: { type: string }
              status: { type: string, enum: [OK, DAMAGED, MISSING] }
              notes: { type: string }
              attachment_ids: { type: array, items: { type: string } }
    ConditionReport:
      allOf:
        - type: object
          properties:
            condition_report_id: { type: string }
            rental_id: { type: string }
            kind: { type: string, enum: [CHECKOUT, CHECKIN, SUPPLEMENTARY] }
            recorded_at: { type: string, format: date-time }
            recorded_by: { type: string }
            hub_id: { type: string }
        - $ref: '#/components/schemas/ConditionReportInput'
    CheckoutRequest:
      type: object
      required: [hub_id, identity_check, condition_report]
      description: "Either `reservation_id`, or (`customer_id`, `bike_id`, `due_at`) for a walk-in."
      properties:
        reservation_id: { type: string }
        customer_id: { type: string }
        hub_id: { type: string }
        bike_id: { type: string, description: Walk-in bike, or substitute for a reservation }
        due_at: { type: string, format: date-time }
        planned_return_hub_id: { type: string }
        equipment_ids: { type: array, items: { type: string } }
        identity_check: { $ref: '#/components/schemas/IdentityCheck' }
        condition_report: { $ref: '#/components/schemas/ConditionReportInput' }
    CheckinRequest:
      type: object
      required: [return_hub_id, condition_report]
      properties:
        return_hub_id: { type: string }
        condition_report: { $ref: '#/components/schemas/ConditionReportInput' }
    Rental:
      type: object
      properties:
        rental_id: { type: string }
        status: { $ref: '#/components/schemas/RentalStatus' }
        reservation_id: { type: string, nullable: true }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        bike_id: { type: string }
        pickup_hub_id: { type: string }
        planned_return_hub_id: { type: string }
        return_hub_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, nullable: true }
        equipment: { type: array, items: { $ref: '#/components/schemas/EquipmentRef' } }
        flags: { type: array, items: { $ref: '#/components/schemas/RentalFlag' } }
        checked_out_by: { type: string }
        checked_in_by: { type: string, nullable: true }
        extensions: { type: array, items: { $ref: '#/components/schemas/RentalExtension' } }
        condition_report_ids: { type: array, items: { type: string } }
        invoice_id: { type: string, nullable: true }
    RentalPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Rental' } }
        next_cursor: { type: string, nullable: true }
    RentalDetail:
      allOf:
        - $ref: '#/components/schemas/Rental'
        - type: object
          properties:
            condition_reports: { type: array, items: { $ref: '#/components/schemas/ConditionReport' } }
            charges: { $ref: '#/components/schemas/Charges' }
            allowed_actions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
    CheckinResult:
      type: object
      properties:
        rental: { $ref: '#/components/schemas/Rental' }
        invoice: { $ref: '#/components/schemas/Invoice' }
        operations_followups:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [DIFFERENT_RETURN_HUB, EQUIPMENT_DAMAGED, EQUIPMENT_MISSING, BIKE_DAMAGED, LOW_BATTERY] }
              reference: { type: string }
    RentalExtensionCreate:
      type: object
      required: [new_due_at]
      properties:
        new_due_at: { type: string, format: date-time }
    RentalExtension:
      type: object
      properties:
        extension_id: { type: string }
        rental_id: { type: string }
        previous_due_at: { type: string, format: date-time }
        new_due_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    # ── faults, maintenance, operations ──
    FaultCreate:
      type: object
      required: [bike_id, severity, category, description]
      properties:
        bike_id: { type: string }
        severity: { $ref: '#/components/schemas/FaultSeverity' }
        category: { type: string, enum: [BRAKES, BATTERY, MOTOR, FRAME, TYRES, LIGHTS, ELECTRONICS, OTHER] }
        description: { type: string, maxLength: 2000 }
        rental_id: { type: string }
        condition_report_id: { type: string }
        related_fault_id: { type: string }
        attachment_ids: { type: array, items: { type: string } }
    Fault:
      type: object
      properties:
        fault_id: { type: string }
        bike_id: { type: string }
        severity: { $ref: '#/components/schemas/FaultSeverity' }
        category: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/FaultStatus' }
        reported_by: { type: string }
        reported_at: { type: string, format: date-time }
        hub_id: { type: string, nullable: true }
        assigned_to: { type: string, nullable: true }
        affected_reservation_ids: { type: array, items: { type: string } }
        bike_technical_status: { $ref: '#/components/schemas/TechnicalStatus' }
        resolution:
          type: object
          nullable: true
          properties:
            resolution_type: { type: string, enum: [FIXED, NOT_REPRODUCIBLE, DUPLICATE] }
            notes: { type: string }
            resolved_by: { type: string }
            resolved_at: { type: string, format: date-time }
    FaultResolve:
      type: object
      required: [resolution_type]
      properties:
        resolution_type: { type: string, enum: [FIXED, NOT_REPRODUCIBLE, DUPLICATE] }
        notes: { type: string, maxLength: 2000 }
        duplicate_of_fault_id: { type: string }
    FaultPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Fault' } }
        next_cursor: { type: string, nullable: true }
    MaintenanceWindowCreate:
      type: object
      required: [bike_id, start, end, reason]
      properties:
        bike_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        fault_id: { type: string }
        displacement: { $ref: '#/components/schemas/Displacement' }
    MaintenanceWindow:
      type: object
      properties:
        maintenance_window_id: { type: string }
        bike_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        fault_id: { type: string, nullable: true }
        status: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED] }
        created_by: { type: string }
        displaced_reservations: { $ref: '#/components/schemas/DisplacedReservations' }
    MaintenanceWindowPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MaintenanceWindow' } }
        next_cursor: { type: string, nullable: true }
    DisplacedReservations:
      type: array
      items:
        type: object
        properties:
          reservation_id: { type: string }
          outcome: { type: string, enum: [REASSIGNED, CANCELLED_FREE] }
          new_bike_id: { type: string, nullable: true }
    OperationalBlockCreate:
      type: object
      required: [scope, start, end, reason]
      properties:
        scope: { type: string, enum: [HUB, BIKE] }
        hub_id: { type: string }
        bike_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        displacement: { $ref: '#/components/schemas/Displacement' }
    OperationalBlock:
      type: object
      properties:
        block_id: { type: string }
        scope: { type: string, enum: [HUB, BIKE] }
        hub_id: { type: string, nullable: true }
        bike_id: { type: string, nullable: true }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [ACTIVE, ENDED, CANCELLED] }
        created_by: { type: string }
        displaced_reservations: { $ref: '#/components/schemas/DisplacedReservations' }
    OperationalBlockPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperationalBlock' } }
        next_cursor: { type: string, nullable: true }
    ServiceOutageCreate:
      type: object
      required: [scope, start, end, description]
      properties:
        scope: { type: string, enum: [NETWORK, HUB, BIKE] }
        hub_id: { type: string }
        bike_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        description: { type: string }
    ServiceOutage:
      allOf:
        - type: object
          properties:
            outage_id: { type: string }
            created_by: { type: string, description: Coordinator id or SYSTEM }
            created_at: { type: string, format: date-time }
        - $ref: '#/components/schemas/ServiceOutageCreate'
    ServiceOutagePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServiceOutage' } }
        next_cursor: { type: string, nullable: true }

    # ── operator queue ──
    OperatorQueue:
      type: object
      properties:
        hub_id: { type: string }
        date: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        planned_pickups:
          type: array
          items:
            type: object
            properties:
              reservation_id: { type: string }
              start: { type: string, format: date-time }
              collect_by: { type: string, format: date-time }
              customer_display_name: { type: string }
              bike_id: { type: string }
              equipment_types: { type: array, items: { $ref: '#/components/schemas/EquipmentType' } }
              origin: { type: string }
              at_risk: { type: boolean, description: Reserved bike is no longer checkoutable }
        expected_returns:
          type: array
          items:
            type: object
            properties:
              rental_id: { type: string }
              due_at: { type: string, format: date-time }
              bike_id: { type: string }
              customer_display_name: { type: string }
              pickup_hub_id: { type: string }
        overdue_rentals:
          type: array
          items:
            type: object
            properties:
              rental_id: { type: string }
              due_at: { type: string, format: date-time }
              minutes_overdue: { type: integer }
              bike_id: { type: string }
              customer_display_name: { type: string }
              pickup_hub_id: { type: string }
              planned_return_hub_id: { type: string }
        bikes_needing_attention:
          type: array
          items:
            type: object
            properties:
              bike_id: { type: string }
              reasons: { type: array, items: { type: string, enum: [OPEN_CRITICAL_FAULT, OPEN_FAULT, LOW_BATTERY, MAINTENANCE_TODAY, RETURNED_FROM_OTHER_HUB, DAMAGE_REPORTED] } }
              battery_pct: { type: integer }
              open_fault_ids: { type: array, items: { type: string } }
              bookable: { type: boolean }
        equipment_needing_attention:
          type: array
          items:
            type: object
            properties:
              equipment_id: { type: string }
              equipment_type: { $ref: '#/components/schemas/EquipmentType' }
              status: { $ref: '#/components/schemas/EquipmentStatus' }

    # ── reservation requests ──
    Recurrence:
      type: object
      required: [frequency, weekday, start_local_time, end_local_time, time_zone, first_date, occurrence_count]
      properties:
        frequency: { type: string, enum: [WEEKLY] }
        weekday: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        start_local_time: { type: string, pattern: '^\d{2}:\d{2}$' }
        end_local_time: { type: string, pattern: '^\d{2}:\d{2}$' }
        time_zone: { type: string, example: Europe/Berlin }
        first_date: { type: string, format: date }
        occurrence_count: { type: integer, minimum: 1, maximum: 26 }
    ReservationRequestCreate:
      type: object
      required: [pickup_hub_id, bike_count, recurrence]
      properties:
        pickup_hub_id: { type: string }
        planned_return_hub_id: { type: string }
        bike_count: { type: integer, minimum: 1, maximum: 10 }
        requirements: { $ref: '#/components/schemas/Requirements' }
        equipment_per_bike:
          type: array
          items:
            type: object
            properties:
              equipment_type: { $ref: '#/components/schemas/EquipmentType' }
              quantity: { type: integer, minimum: 1 }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        purpose: { type: string, maxLength: 500 }
    ReservationRequestAmend:
      type: object
      minProperties: 1
      properties:
        effective_from: { type: string, format: date, description: Required when the request is APPROVED }
        bike_count: { type: integer, minimum: 1, maximum: 10 }
        requirements: { $ref: '#/components/schemas/Requirements' }
        start_local_time: { type: string }
        end_local_time: { type: string }
        occurrence_count: { type: integer, minimum: 1, maximum: 26 }
    Fulfilment:
      type: object
      properties:
        occurrences_total: { type: integer }
        bikes_requested_total: { type: integer }
        reservations_created: { type: integer }
        bikes_unfulfilled: { type: integer }
    Shortfall:
      type: object
      properties:
        count: { type: integer }
        reason: { type: string, enum: [MAINTENANCE_WINDOW, OPERATIONAL_BLOCK, CRITICAL_FAULT, INSUFFICIENT_FLEET, ALREADY_RESERVED] }
        reference: { type: string, nullable: true }
    Occurrence:
      type: object
      properties:
        occurrence_id: { type: string }
        date: { type: string, format: date }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, FULFILLED, PARTIALLY_FULFILLED, UNFULFILLED, CANCELLED] }
        bikes_requested: { type: integer }
        bikes_allocated: { type: integer }
        reservation_ids: { type: array, items: { type: string } }
        shortfall: { type: array, items: { $ref: '#/components/schemas/Shortfall' } }
    ReservationRequest:
      allOf:
        - type: object
          properties:
            request_id: { type: string }
            organisation_id: { type: string }
            created_by: { type: string }
            status: { $ref: '#/components/schemas/ReservationRequestStatus' }
            fulfilment: { $ref: '#/components/schemas/Fulfilment' }
            decision:
              type: object
              nullable: true
              properties:
                decided_by: { type: string }
                decided_at: { type: string, format: date-time }
                note: { type: string }
            pending_amendment: { $ref: '#/components/schemas/ReservationRequestAmend' }
            created_at: { type: string, format: date-time }
        - $ref: '#/components/schemas/ReservationRequestCreate'
    ReservationRequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReservationRequest' } }
        next_cursor: { type: string, nullable: true }
    Feasibility:
      type: object
      properties:
        request_id: { type: string }
        evaluated_at: { type: string, format: date-time }
        fully_feasible: { type: boolean }
        occurrences: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
    RequestApproval:
      type: object
      required: [allow_partial]
      properties:
        allow_partial: { type: boolean }
        note: { type: string, maxLength: 1000 }
    ApprovalResult:
      type: object
      properties:
        request_id: { type: string }
        status: { $ref: '#/components/schemas/ReservationRequestStatus' }
        fulfilment: { $ref: '#/components/schemas/Fulfilment' }
        occurrences_href: { type: string }
        unfulfilled: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
        replaced_reservation_ids: { type: array, items: { type: string }, description: Only for amendment approvals }
    RequestCancellation:
      type: object
      properties:
        effective_from: { type: string, format: date, description: Defaults to today }
        service_outage_id: { type: string }
        comment: { type: string }
    RequestCancellationResult:
      type: object
      properties:
        request_id: { type: string }
        status: { $ref: '#/components/schemas/ReservationRequestStatus' }
        cancelled_reservations:
          type: array
          items:
            type: object
            properties:
              reservation_id: { type: string }
              start: { type: string, format: date-time }
              fee_minor: { type: integer }
        kept_reservation_ids: { type: array, items: { type: string } }
        currency: { type: string }
        fee_invoice_id: { type: string, nullable: true }

    # ── billing ──
    LineItem:
      type: object
      properties:
        line_item_id: { type: string }
        type: { type: string, enum: [BASE_DURATION, EQUIPMENT, LATE_RETURN_FEE, DIFFERENT_HUB_FEE, CANCELLATION_FEE, NO_SHOW_FEE, DAMAGE_FEE] }
        description: { type: string }
        quantity: { type: integer }
        unit_amount_minor: { type: integer }
        amount_minor: { type: integer }
    CreditNoteSummary:
      type: object
      properties:
        credit_note_id: { type: string }
        amount_minor: { type: integer }
        line_item_id: { type: string, nullable: true }
        dispute_id: { type: string, nullable: true }
        issued_at: { type: string, format: date-time }
    Invoice:
      type: object
      description: Immutable once issued. `credit_notes` and `net_amount_minor` are derived from linked documents.
      properties:
        invoice_id: { type: string }
        invoice_number: { type: string }
        status: { type: string, enum: [ISSUED] }
        customer: { $ref: '#/components/schemas/CustomerRef' }
        source:
          type: object
          properties:
            type: { type: string, enum: [RENTAL, CANCELLATION, EXPIRY, DAMAGE_ASSESSMENT, REPLACEMENT] }
            id: { type: string }
        currency: { type: string }
        line_items: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        total_minor: { type: integer }
        issued_at: { type: string, format: date-time }
        replaces_invoice_id: { type: string, nullable: true }
        credit_notes: { type: array, readOnly: true, items: { $ref: '#/components/schemas/CreditNoteSummary' } }
        net_amount_minor: { type: integer, readOnly: true }
    InvoicePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        next_cursor: { type: string, nullable: true }
    CreditNoteCreate:
      type: object
      required: [amount_minor, reason, settlement]
      properties:
        amount_minor: { type: integer, minimum: 1 }
        line_item_id: { type: string }
        reason: { type: string }
        settlement: { type: string, enum: [REFUND_TO_PAYMENT_METHOD, ACCOUNT_CREDIT] }
        replacement:
          type: object
          description: Optional replacement invoice when the original is fully credited
          properties:
            line_items: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
    CreditNote:
      type: object
      description: Immutable.
      properties:
        credit_note_id: { type: string }
        credit_note_number: { type: string }
        invoice_id: { type: string }
        line_item_id: { type: string, nullable: true }
        dispute_id: { type: string, nullable: true }
        amount_minor: { type: integer }
        currency: { type: string }
        reason: { type: string }
        settlement: { type: string, enum: [REFUND_TO_PAYMENT_METHOD, ACCOUNT_CREDIT] }
        replacement_invoice_id: { type: string, nullable: true }
        issued_by: { type: string }
        issued_at: { type: string, format: date-time }

    # ── disputes ──
    DisputeCreate:
      type: object
      required: [invoice_id, line_item_id, disputed_amount_minor, reason_code, explanation]
      properties:
        invoice_id: { type: string }
        line_item_id: { type: string }
        disputed_amount_minor: { type: integer, minimum: 1 }
        reason_code: { type: string, enum: [LATE_FEE_INCORRECT, DURATION_INCORRECT, EQUIPMENT_NOT_USED, DIFFERENT_HUB_FEE, DAMAGE_CHARGE, CANCELLATION_FEE, OTHER] }
        explanation: { type: string, maxLength: 2000 }
        attachment_ids: { type: array, items: { type: string } }
    Dispute:
      type: object
      properties:
        dispute_id: { type: string }
        invoice_id: { type: string }
        line_item_id: { type: string }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        reason_code: { type: string }
        explanation: { type: string }
        disputed_amount_minor: { type: integer }
        currency: { type: string }
        attachment_ids: { type: array, items: { type: string } }
        opened_by: { type: string }
        opened_at: { type: string, format: date-time }
        assigned_to: { type: string, nullable: true }
        resolution:
          type: object
          nullable: true
          properties:
            decision: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
            credited_amount_minor: { type: integer }
            credit_note_id: { type: string, nullable: true }
            settlement: { type: string, nullable: true }
            note: { type: string }
            resolved_by: { type: string }
            resolved_at: { type: string, format: date-time }
    DisputePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Dispute' } }
        next_cursor: { type: string, nullable: true }
    DisputeResolve:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED] }
        credit_amount_minor: { type: integer, minimum: 1, description: Required unless REJECTED }
        settlement: { type: string, enum: [REFUND_TO_PAYMENT_METHOD, ACCOUNT_CREDIT] }
        note: { type: string, maxLength: 2000 }
