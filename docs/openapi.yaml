  /v1/rentals/{rentalId}/checkin:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    post:
      tags: [Rentals]
      operationId: checkinRental
      summary: Check in (end a rental) – records return hub, battery, condition, equipment; issues the invoice
      description: |
        **Roles:** Hub operator assigned to `return_hub_id`.
        From `ACTIVE` or `OVERDUE` to `RETURNED`. Return time = server time. Every rented equipment item must appear in
        `condition_report.equipment`. Returns at another hub are accepted and flagged (`DIFFERENT_RETURN_HUB`, possible fee).
        Charges are computed from actual duration, equipment and late fee; the invoice is issued immutably in the same transaction.
        Returns `200` (transition of an existing resource); the created invoice is embedded and linked.
      x-roles: [HUB_OPERATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckinRequest' }
            example:
              return_hub_id: HUB-02
              condition_report:
                battery_pct: 20
                bike_condition: GOOD
                equipment:
                  - { equipment_id: EQ-CHILD-01, status: OK }
                  - { equipment_id: EQ-RAIN-02, status: DAMAGED, notes: Torn side seam, attachment_ids: [ATT-77] }
      responses:
        '200':
          description: Rental returned and invoiced (example success response 2)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            Link:
              schema: { type: string }
              example: '</v1/invoices/INV-5011>; rel="invoice"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
              example:
                rental:
                  rental_id: RNT-8812
                  status: RETURNED
                  reservation_id: RES-9901
                  customer: { type: RESIDENT, id: USR-1001 }
                  bike_id: BIKE-402
                  pickup_hub_id: HUB-01
                  planned_return_hub_id: HUB-01
                  return_hub_id: HUB-02
                  started_at: "2026-11-20T09:05:00Z"
                  due_at: "2026-11-20T12:00:00Z"
                  returned_at: "2026-11-20T13:30:00Z"
                  equipment: [ { equipment_id: EQ-CHILD-01, equipment_type: CHILD_SEAT }, { equipment_id: EQ-RAIN-02, equipment_type: RAIN_COVER } ]
                  flags: [LATE_RETURN, DIFFERENT_RETURN_HUB, EQUIPMENT_DAMAGED]
                  checked_out_by: OP-11
                  checked_in_by: OP-27
                  extensions: []
                  condition_report_ids: [CR-1, CR-2]
                  invoice_id: INV-5011
                invoice:
                  invoice_id: INV-5011
                  invoice_number: UM-2026-005011
                  status: ISSUED
                  customer: { type: RESIDENT, id: USR-1001 }
                  source: { type: RENTAL, id: RNT-8812 }
                  currency: EUR
                  line_items:
                    - { line_item_id: LI-5011-1, type: BASE_DURATION, description: "Cargo bike, 4 h 25 min (9 × 30 min)", quantity: 9, unit_amount_minor: 250, amount_minor: 2250 }
                    - { line_item_id: LI-5011-2, type: EQUIPMENT, description: Child seat, quantity: 1, unit_amount_minor: 300, amount_minor: 300 }
                    - { line_item_id: LI-5011-3, type: EQUIPMENT, description: Rain cover, quantity: 1, unit_amount_minor: 200, amount_minor: 200 }
                    - { line_item_id: LI-5011-4, type: LATE_RETURN_FEE, description: "Late return, 90 min (3 × 30 min)", quantity: 3, unit_amount_minor: 500, amount_minor: 1500 }
                    - { line_item_id: LI-5011-5, type: DIFFERENT_HUB_FEE, description: "Return at HUB-02 instead of HUB-01", quantity: 1, unit_amount_minor: 800, amount_minor: 800 }
                  total_minor: 5050
                  issued_at: "2026-11-20T13:30:02Z"
                  replaces_invoice_id: null
                  credit_notes: []
                  net_amount_minor: 5050
                operations_followups:
                  - { type: DIFFERENT_RETURN_HUB, reference: RNT-8812 }
                  - { type: EQUIPMENT_DAMAGED, reference: EQ-RAIN-02 }
                  - { type: LOW_BATTERY, reference: BIKE-402 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`INVALID_STATE_TRANSITION` (already returned), `IDEMPOTENCY_IN_PROGRESS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`EQUIPMENT_NOT_ACCOUNTED_FOR`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/rentals/{rentalId}/extensions:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    post:
      tags: [Rentals]
      operationId: extendRental
      summary: Extend an active rental
      description: |
        **Roles:** rental owner (Resident / Org member); Hub operator assigned to the pickup or planned return hub.
        Only while `ACTIVE` and before `due_at` (an `OVERDUE` rental cannot be extended retroactively → `409`).
        The bike and all rented equipment must be free until `new_due_at` (allocation constraint → `409 ASSET_UNAVAILABLE`
        if a following reservation, maintenance window or block exists). Extensions are records, so the history stays visible.
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentalExtensionCreate' }
            example: { new_due_at: "2026-11-20T13:00:00Z" }
      responses:
        '201':
          description: Extended
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalExtension' }
              example: { extension_id: EXT-55, rental_id: RNT-8812, previous_due_at: "2026-11-20T12:00:00Z", new_due_at: "2026-11-20T13:00:00Z", created_by: USR-1001, created_at: "2026-11-20T11:20:00Z" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ───────────────────────────── Condition reports ─────────────────────────────
  /v1/rentals/{rentalId}/condition-reports:
    parameters:
      - $ref: '#/components/parameters/RentalId'
    get:
      tags: [Condition reports]
      operationId: listConditionReports
      summary: List condition reports of a rental
      description: "**Roles & scope:** as `GET /v1/rentals/{rentalId}`; Technician may read too (fault diagnosis)."
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, SUPPORT_AGENT, TECHNICIAN]
      responses:
        '200':
          description: Reports, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConditionReport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Condition reports]
      operationId: addSupplementaryConditionReport
      summary: Append a supplementary condition report
      description: |
        **Roles:** Hub operator assigned to the hub where the bike is now. `CHECKOUT` and `CHECKIN` reports are created only
        by checkout/check-in; this endpoint creates `SUPPLEMENTARY` reports (e.g. damage noticed after the return).
        Reports are append-only: no `PATCH`/`DELETE`. It never changes an already issued invoice.
      x-roles: [HUB_OPERATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionReportInput' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/condition-reports/{conditionReportId}:
    parameters:
      - name: conditionReportId
