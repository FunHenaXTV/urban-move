            application/json:
              schema: { $ref: '#/components/schemas/OperationalBlockPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Operations]
      operationId: createOperationalBlock
      summary: Block a hub or bike for an event
      description: |
        **Roles:** Operations coordinator. A hub block allocates every bike and equipment item of the hub for the period.
        With `displacement: NONE` (default) any overlap → `409 ALLOCATION_CONFLICT`; with `REASSIGN_OR_CANCEL` affected
        reservations are moved to an equivalent bike or cancelled free of charge (listed in the response).
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationalBlockCreate' }
            example: { scope: HUB, hub_id: HUB-03, start: "2026-12-05T06:00:00Z", end: "2026-12-05T20:00:00Z", reason: Christmas market setup, displacement: REASSIGN_OR_CANCEL }
      responses:
        '201':
          description: Block created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalBlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/operational-blocks/{blockId}:
    parameters:
      - $ref: '#/components/parameters/BlockId'
    get:
      tags: [Operations]
      operationId: getOperationalBlock
