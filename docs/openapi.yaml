openapi: 3.0.3
info:
  title: UrbanMove Cargo-Bike Sharing API
  version: 1.0.0
  description: |
    API contract for **UrbanMove**, the city's network of electrically assisted cargo bikes at mobility hubs.
    Consumers: the customer web/mobile app, the hub-operator app and the internal operations dashboard.

    This document is the complete submission: endpoint catalogue (see operations below), conventions,
    the five workflows, lifecycle tables, example responses, assumptions and key design decisions.

    ---

    # 1. Conventions

    ## Versioning
    * Major version in the path: `/v1/...`. Additive, backwards-compatible changes (new optional fields,
      new endpoints, new enum values flagged as *extensible*) do **not** change the version.
    * Breaking changes ship as `/v2` alongside `/v1`. A retiring version returns `Deprecation` and
      `Sunset` headers for at least 6 months before removal.
    * Clients must ignore unknown response fields.

    ## Media types
    | Media type | Used for | Why |
    |---|---|---|
    | `application/json` | all request and response bodies | default |
    | `application/problem+json` | all error responses | RFC 9457 (formerly 7807) standard error format |
    | `multipart/form-data` | `POST /v1/attachments` (photos of damage/faults) | binary upload; JSON+base64 would inflate size by ~33 % |
    | `application/pdf` | `GET /v1/invoices/{id}` with `Accept: application/pdf` | legally required printable rendition of the *same* resource (content negotiation, not a separate endpoint) |

    ## Data formats
    * Timestamps: ISO-8601 UTC (`2026-11-20T09:00:00Z`). Recurring requests use local wall-clock time plus an IANA `time_zone`.
    * Money: integer minor units (`amount_minor: 2250` = EUR 22.50) plus an ISO-4217 `currency`.
    * IDs are opaque strings with a type prefix (`RES-`, `RNT-`, `INV-`...). Clients must not parse them.

    ## Pagination and filtering
    All collection `GET`s are cursor-paginated: `?limit=` (1–100, default 20) and `?cursor=`. Responses have
    `{ "items": [...], "next_cursor": "..." | null }` and a `Link: <...>; rel="next"` header.
    Cursor pagination is stable while new reservations are inserted (offset pagination is not).

    ## Authentication and roles
    OAuth 2.0 / OIDC bearer JWT issued by the city identity provider. Relevant claims:
    `sub` (user id), `roles[]`, `organisation_id` (organisation members), `assigned_hub_ids[]` (hub operators).

    | Role (`roles` claim) | Capability summary |
    |---|---|
    | `RESIDENT` | own profile, availability search, own reservations / rentals / invoices / disputes |
    | `ORG_MEMBER` | everything `RESIDENT` can + create/view reservation requests of **their** organisation, act on that organisation's reservations |
    | `HUB_OPERATOR` | checkout / check-in / condition reports / operator queue **only at `assigned_hub_ids`**; may report faults |
    | `OPS_COORDINATOR` | approve/reject organisation requests, operational blocks, service outages, hub & fleet management |
    | `TECHNICIAN` | faults and maintenance windows; read bikes. **No** access to reservations, invoices or charges |
    | `SUPPORT_AGENT` | read invoices/disputes/reservations of any customer, resolve disputes, issue credit notes |

    **No system-administrator role is introduced.** User provisioning, role assignment and operator-hub
    assignment happen in the city identity provider; hub and fleet management is already a coordinator
    capability. No API capability remains that would justify a separate role.

    Every operation lists its allowed roles in its description and in the `x-roles` extension.

    ## Error model
    All errors use `application/problem+json` (schema `Problem`). `code` is a stable, machine-readable
    identifier that clients switch on. `title`/`detail` are human-readable and may change.

    | Status | Meaning in this API |
    |---|---|
    | 400 `VALIDATION_FAILED` | malformed JSON or schema violation; `errors[]` lists the fields |
    | 401 `UNAUTHENTICATED` | missing/expired token |
    | 403 | the role lacks the capability (`ROLE_NOT_PERMITTED`) or the operator is not assigned to the hub (`HUB_NOT_ASSIGNED`) |
    | 404 `NOT_FOUND` | resource does not exist **or the caller may not know it exists** (another resident's invoice) |
    | 409 | request conflicts with *current state*: overlap/double booking, invalid state transition, reservation limit, idempotency key still being processed |
    | 412 `ETAG_MISMATCH` | `If-Match` is stale (optimistic concurrency) |
    | 422 | well-formed but violates a business rule independent of concurrent state (bike does not meet requirements, end before start, idempotency key reused with a different body) |
    | 428 `IF_MATCH_REQUIRED` | `PATCH` without `If-Match` |
    | 429 `RATE_LIMITED` | with `Retry-After` |

    ## Idempotency (safe retries)
    Every `POST` that creates something or performs a state transition **requires** an `Idempotency-Key`
    header (UUID v4, generated by the client once per *user intent*, reused on every retry of that intent).
    * The server stores `(key, caller sub, endpoint)` with a hash of the body and the final response for **24 h**.
    * Same key + same body → the stored response is replayed (same status, same body) with `Idempotent-Replayed: true`. No second execution.
    * Same key + different body → `422 IDEMPOTENCY_KEY_REUSED`.
    * Same key while the first request is still running → `409 IDEMPOTENCY_IN_PROGRESS` with `Retry-After: 1`.
    * 2xx and 4xx business outcomes are stored; 5xx responses are not (retrying actually retries).

    ## Optimistic concurrency
    Mutable master data (hubs, bikes, equipment, profile, reservation-request amendments) return an `ETag`.
    `PATCH` requires `If-Match`, so two coordinators cannot overwrite each other silently.

    ## Resources, actions and views
    * **Resources** (nouns, CRUD-like): hubs, bikes, equipment, reservations, rentals, condition reports,
      faults, maintenance windows, operational blocks, service outages, reservation requests (+ occurrences),
      invoices, credit notes, disputes, attachments.
    * **State transitions** with side effects are modelled as `POST /{collection}/{id}/{action}`
      (`/cancel`, `/checkin`, `/approve`, `/reject`, `/resolve`, `/start-work`, `/start-review`, `/withdraw`, `/complete`).
      Rationale: each one has its own permission rule, its own request body (e.g. `service_outage_id`,
      condition report), its own side effects (fees, invoices, displacement) and must be idempotent via
      `Idempotency-Key`. A generic `PATCH {status: ...}` could not express that and would invite invalid transitions.
      `POST` is used (not `PATCH`) because the call is not a partial update of the representation.
    * Where the result of an action is a **new thing with its own identity**, it is a resource creation instead:
      checkout = `POST /v1/rentals`, extension = `POST /v1/rentals/{id}/extensions`,
      partial credit = a `CreditNote` created by the dispute resolution, condition report = `ConditionReport`.
    * **Views** (read-only, computed, never stored): `GET /v1/availability/hub-summaries` (map),
      `GET /v1/availability/bikes` (eligible bike search), `GET /v1/hubs/{id}/operator-queue`,
      `GET /v1/reservation-requests/{id}/feasibility`. They are `GET` on nouns describing the view so they are cacheable.

    ---

    # 2. Key design decisions

    1. **Reservation ≠ Rental.** A reservation is a time-bound *promise* created by a customer; a rental is
       *physical custody* started by an operator with an identity check and a condition report. Rentals can
       exist without reservations (walk-in), can be extended and returned late; reservations can expire.
       Separate resources give separate permissions, lifecycles and audit trails.
    2. **One allocation ledger, enforced by the database.** Reservations, rentals, maintenance windows and
       operational blocks all write *allocations* `(asset_id, time range)` into one table with an exclusion
       constraint (no overlapping ranges per bike or equipment item). Creating a reservation inserts the bike
       and all equipment allocations in one transaction: all or nothing. Concurrent winners/losers are
       decided by the database, never by a check-then-insert in application code → no double bookings, `409` for the loser.
    3. **Financial documents are immutable.** `Invoice` and `CreditNote` have no `PATCH`/`DELETE`.
       Corrections are new credit notes (partial) or a full credit note plus a replacement invoice
       (`replaces_invoice_id`). The invoice representation shows linked credit notes and a *derived* `net_amount_minor`.

    ### A choice that looked RESTful but was rejected
    `PATCH /v1/reservations/{id}` with `{"status": "CANCELLED"}` (or `DELETE /v1/reservations/{id}`).
    It looks like textbook REST, but cancellation is not a field edit: it requires a reason, may require a
    documented `service_outage_id`, may issue a fee invoice, must be idempotent, and is only valid from
    `CONFIRMED`. `DELETE` also implies the resource disappears, while we must keep it for audit and billing.
    We use `POST /v1/reservations/{id}/cancel` and the reservation remains readable as `CANCELLED`.

    ### Trade-off: convenient client API vs business invariants
    *Convenient:* the availability search could put a soft hold on the bike, so "Reserve" never fails,
    and reservations could be edited in place (`PATCH` start/end/bike).
    *Chosen:* search results are a **non-binding snapshot**; only `POST /v1/reservations` is atomic, and
    clients must handle `409` (re-search and retry). Reservations cannot be re-timed; the client cancels and creates a new one
    (free if > 24 h before start). Soft holds would let a client block the last bike without booking, and
    in-place edits would need the same overlap check, fee rules and limit check as cancel+create, plus extra edge cases.
    The app hides this by offering the next-best bike from the `409` body (`alternatives_href`).

    ---

    # 3. Assumptions

    1. The JWT is trusted; `assigned_hub_ids` reflects current assignments (short token lifetime, 15 min).
    2. "Active reservation" = status `CONFIRMED`. Reservations created from an **organisation** request belong
       to the organisation account and do **not** count toward a member's personal limit of two.
    3. A bike is bookable for a period only if: no open `CRITICAL` fault, no overlapping maintenance window,
       operational block, reservation or rental, not retired, current `battery_pct ≥ 30` (network minimum) **and**
       estimated range ≥ the requested `min_range_km`. Bikes below the minimum are shown in the operator queue as "needs charging".
    4. Reservation slots are between 30 min and 8 h, start at least 10 min in the future and at most 60 days ahead.
    5. A reservation is "collected" when the checkout (`POST /v1/rentals`) happens. If not collected by
       `start + 15 min`, the system expires it; expiry is charged like a late cancellation (no-show fee).
    6. Late cancellation (< 24 h before start) is free only with a `service_outage_id` that covers the reservation's
       hub/bike and time. Outages are created by coordinators; a critical fault on a reserved bike that cannot be
       substituted automatically creates such an outage record.
    7. Pricing (illustrative values used in examples): EUR 2.50 per started 30 min; child seat EUR 3.00 and rain cover
       EUR 2.00 flat per rental; late fee EUR 5.00 per started 30 min after `due_at`; different-hub return fee EUR 8.00
       (configurable per hub pair, may be 0). Prices include VAT. Cancellation/no-show fee EUR 5.00.
    8. Equipment damage is **not** priced at check-in. Damaged/missing items are flagged; if a damage charge is
       later decided, it is issued as a **separate** invoice (`source.type = DAMAGE_ASSESSMENT`).
    9. Check-in time is the server time of the check-in request, not a client-supplied value.
    10. Equipment returned at another hub now belongs to the return hub (like the bike); coordinators rebalance.
    11. Disputes can be opened within 60 days of invoice issue, one open dispute per invoice line item.
    12. Payment collection is handled by an external payment provider; payment status is outside this contract.
    13. If a maintenance window or block is created over existing reservations, technicians get `409` (they cannot
        change reservations); a coordinator may pass `displacement: REASSIGN_OR_CANCEL`: the system moves each reservation
        to an equivalent eligible bike, or cancels it free of charge with reason `OPERATIONAL_DISPLACEMENT` and notifies the customer.

    ---

    # 4. Workflows

    ## W1 – Resident finds an eligible bike and reserves it with two pieces of equipment
    ```
    GET /v1/availability/bikes?hub_id=HUB-01&start=2026-11-20T09:00:00Z&end=2026-11-20T12:00:00Z
        &min_load_capacity_kg=80&accessibility_features=STEP_THROUGH_FRAME&min_range_km=30
        &equipment_types=CHILD_SEAT,RAIN_COVER
    → 200 OK   Cache-Control: no-store
    { "hub_id":"HUB-01", ..., "bikes":[{"bike_id":"BIKE-402","load_capacity_kg":120,"battery_pct":92,...}],
      "equipment":[{"equipment_id":"EQ-CHILD-01","equipment_type":"CHILD_SEAT"},
                   {"equipment_id":"EQ-RAIN-02","equipment_type":"RAIN_COVER"}],
      "is_binding": false }
    ```
    Only bikes that satisfy **every** rule for the **whole** period are returned (fault/maintenance/block/battery/
    overlap/requirements). A bike parked at HUB-01 but with a critical fault is simply absent.
    ```
    POST /v1/reservations
    Idempotency-Key: 3f1c2a8e-7c11-4a55-9a8e-2b8f0c6d1e01
    { "bike_id":"BIKE-402","pickup_hub_id":"HUB-01","planned_return_hub_id":"HUB-01",
      "start":"2026-11-20T09:00:00Z","end":"2026-11-20T12:00:00Z",
      "equipment_ids":["EQ-CHILD-01","EQ-RAIN-02"],
      "requirements":{"min_load_capacity_kg":80,"accessibility_features":["STEP_THROUGH_FRAME"],"min_range_km":30} }
    → 201 Created   Location: /v1/reservations/RES-9901   ETag: "1"
    { "reservation_id":"RES-9901","status":"CONFIRMED","collect_by":"2026-11-20T09:15:00Z",
      "free_cancellation_until":"2026-11-19T09:00:00Z", ... }
    ```
    State after: reservation `CONFIRMED`; allocations for BIKE-402, EQ-CHILD-01, EQ-RAIN-02 on [09:00, 12:00).

    Error paths:
    * already 2 `CONFIRMED` reservations → `409 RESERVATION_LIMIT_REACHED`
    * bike or an equipment item taken meanwhile → `409 ASSET_UNAVAILABLE` (nothing is allocated; all or nothing)
    * bike does not meet `requirements` / battery below minimum / open critical fault → `422 BIKE_NOT_ELIGIBLE`
    * equipment at another hub than `pickup_hub_id` → `422 EQUIPMENT_NOT_AT_HUB`
    * `end ≤ start`, start in the past → `400 VALIDATION_FAILED`; unknown bike → `404`; technician token → `403 ROLE_NOT_PERMITTED`

    ## W2 – Operator checks out the bike, then it is checked in late at another hub with a damaged rain cover
    **Checkout** by operator OP-11 (`assigned_hub_ids: ["HUB-01"]`) at 09:05:
    ```
    POST /v1/rentals
    Idempotency-Key: 9a0e...
    { "reservation_id":"RES-9901","hub_id":"HUB-01",
      "identity_check":{"method":"ID_CARD","verified":true,"document_reference_last4":"4471"},
      "condition_report":{"battery_pct":95,"bike_condition":"GOOD",
        "equipment":[{"equipment_id":"EQ-CHILD-01","status":"OK"},{"equipment_id":"EQ-RAIN-02","status":"OK"}]} }
    → 201 Created   Location: /v1/rentals/RNT-8812
    { "rental_id":"RNT-8812","status":"ACTIVE","due_at":"2026-11-20T12:00:00Z","condition_report_ids":["CR-1"], ... }
    ```
    State after: rental `ACTIVE`; reservation `RES-9901` → `CHECKED_OUT`; CR-1 (kind `CHECKOUT`) stored immutably.
    Errors: OP-11 not assigned to HUB-01 → `403 HUB_NOT_ASSIGNED`; after 09:15 → `409 RESERVATION_NOT_COLLECTABLE`
    (status `EXPIRED`); bike got a critical fault → `409 BIKE_NOT_CHECKOUTABLE` (operator may send `bike_id` of an
    eligible substitute; not eligible → `422 BIKE_NOT_ELIGIBLE`); `identity_check.verified=false` → `422 IDENTITY_NOT_VERIFIED`;
    missing condition report → `400 VALIDATION_FAILED`.

    At 12:00 the system sets the rental to `OVERDUE`; it appears in `overdue_rentals` of the operator queue of HUB-01.

    **Check-in** at 13:30 by operator OP-27 (`assigned_hub_ids: ["HUB-02"]`); OP-11 could not do this, as they are not assigned to HUB-02:
    ```
    POST /v1/rentals/RNT-8812/checkin
    Idempotency-Key: 5d2b...
    { "return_hub_id":"HUB-02",
      "condition_report":{"battery_pct":20,"bike_condition":"GOOD",
        "equipment":[{"equipment_id":"EQ-CHILD-01","status":"OK"},
                     {"equipment_id":"EQ-RAIN-02","status":"DAMAGED","notes":"Torn side seam","attachment_ids":["ATT-77"]}]} }
    → 200 OK
    { "rental":{"rental_id":"RNT-8812","status":"RETURNED","returned_at":"2026-11-20T13:30:00Z",
                "flags":["LATE_RETURN","DIFFERENT_RETURN_HUB","EQUIPMENT_DAMAGED"], ...},
      "invoice":{"invoice_id":"INV-5011","total_minor":5050,"currency":"EUR"} }
    ```
    Invoice INV-5011 (immutable): duration 4 h 25 min → 9 × 250 = 2250; child seat 300; rain cover 200;
    late fee 90 min → 3 × 500 = **1500**; different-hub fee 800 → **total 5050**. No damage fee on it (assumption 8).
    Side effects: BIKE-402 and both equipment items now at HUB-02; EQ-RAIN-02 status `DAMAGED` (not reservable);
    BIKE-402 (20 % battery) and EQ-RAIN-02 appear under "needs attention" in HUB-02's queue; the return is flagged for operations.
    Errors: OP-27 not assigned to `return_hub_id` → `403 HUB_NOT_ASSIGNED`; a rented equipment item missing from
    `condition_report.equipment` → `422 EQUIPMENT_NOT_ACCOUNTED_FOR`; rental already `RETURNED` (new key) → `409 INVALID_STATE_TRANSITION`.
    **The check-in is retried with the same `Idempotency-Key` → the same 200 body is replayed, no second invoice.**

    ## W3 – Two residents reserve the same last eligible bike for the same time
    Resident A (key `aaaa…`) and resident B (key `bbbb…`) both send `POST /v1/reservations` for BIKE-77 at HUB-04,
    2026-11-21 14:00–16:00, at 10:00:00.000.

    Server: both transactions insert an allocation `(BIKE-77, [14:00,16:00))`. The exclusion constraint lets exactly
    one commit (A). B's insert fails on the constraint → its transaction rolls back (including its equipment
    allocations) → `409`. There is no read-then-write gap, so no lock ordering or timing assumption is needed.

    **Resulting state:** exactly one reservation, RES-101 `CONFIRMED` for A; BIKE-77 has one allocation; nothing was
    stored for B; B's active reservation count is unchanged.

    Response to A:
    ```
    201 Created   Location: /v1/reservations/RES-101   ETag: "1"
    { "reservation_id":"RES-101","status":"CONFIRMED","bike_id":"BIKE-77","pickup_hub_id":"HUB-04",
      "start":"2026-11-21T14:00:00Z","end":"2026-11-21T16:00:00Z","collect_by":"2026-11-21T14:15:00Z", ... }
    ```
    Response to B:
    ```
    409 Conflict   Content-Type: application/problem+json
    { "type":"https://api.urbanmove.city/problems/asset-unavailable","title":"Asset no longer available",
      "status":409,"code":"ASSET_UNAVAILABLE",
      "detail":"BIKE-77 was reserved by another customer for an overlapping period.",
      "instance":"/v1/reservations","conflicting_assets":["BIKE-77"],
      "alternatives_href":"/v1/availability/bikes?hub_id=HUB-04&start=2026-11-21T14:00:00Z&end=2026-11-21T16:00:00Z" }
    ```
    B never receives a 201 that is later revoked. If B times out and retries with key `bbbb…`, it gets the same 409 replayed.
    To try again (e.g. another bike) B sends a **new** key.

    ## W4 – Six-week recurring organisation request, one occurrence cannot be fulfilled
    1. Member USR-2001 of ORG-7:
       ```
       POST /v1/reservation-requests    Idempotency-Key: ...
       { "pickup_hub_id":"HUB-04","planned_return_hub_id":"HUB-04","bike_count":3,
         "requirements":{"min_load_capacity_kg":100},
         "recurrence":{"frequency":"WEEKLY","weekday":"TUESDAY","start_local_time":"08:00","end_local_time":"12:00",
                       "time_zone":"Europe/Berlin","first_date":"2026-11-24","occurrence_count":6},
         "purpose":"Food bank deliveries" }
       → 201 Created  Location: /v1/reservation-requests/REQ-44   { "status":"SUBMITTED", ... }
       ```
       No reservations exist yet, so nothing is visible as booked and no assets are allocated.
    2. Coordinator checks `GET /v1/reservation-requests/REQ-44/feasibility` → occurrence 2026-12-08 has only 2 of 3
       eligible bikes: BIKE-12 has maintenance window MW-55 and HUB-04 has only 3 bikes with ≥ 100 kg.
    3. Coordinator approves *without* accepting partial fulfilment:
       `POST /v1/reservation-requests/REQ-44/approve {"allow_partial": false}` →
       `409 PARTIAL_FULFILMENT_NOT_ACCEPTED` listing the short occurrence; **nothing is created**, the request stays `SUBMITTED`.
    4. Coordinator approves with `{"allow_partial": true, "note":"Dec 8: 2 bikes only (maintenance)"}`. In **one transaction**
       the system allocates every occurrence with the same rules and constraint as W1/W3 (if a concurrent booking takes a
       bike in the meantime, that occurrence is re-evaluated in the same transaction) → **200 OK**:
       ```
       { "request_id":"REQ-44","status":"APPROVED",
         "fulfilment":{"occurrences_total":6,"bikes_requested_total":18,"reservations_created":17,"bikes_unfulfilled":1},
         "occurrences_href":"/v1/reservation-requests/REQ-44/occurrences",
         "unfulfilled":[{"occurrence_id":"OCC-44-3","date":"2026-12-08","bikes_requested":3,"bikes_allocated":2,
                         "shortfall":[{"count":1,"reason":"MAINTENANCE_WINDOW","reference":"MW-55"}]}] }
       ```
    **Resulting state:** REQ-44 `APPROVED`; 17 reservations `CONFIRMED` with `origin = ORGANISATION_REQUEST`, `request_id = REQ-44`,
    customer = ORG-7; occurrence OCC-44-3 `PARTIALLY_FULFILLED` (2 reservations); the other 5 occurrences `FULFILLED`.
    No placeholder reservation exists for the missing bike. **The member** receives a notification and sees the same data
    via `GET /v1/reservation-requests/REQ-44` and `/occurrences`. If BIKE-12 is freed later, the occurrence is **not**
    auto-filled (assumption); the member may create an ordinary reservation.

    **Edit after approval** (explicit behaviour): `PATCH /v1/reservation-requests/REQ-44` with `effective_from` →
    status `AMENDMENT_PENDING`; existing reservations stay valid. On coordinator approval, every `CONFIRMED` reservation with
    start ≥ `effective_from` is cancelled (reason `ORGANISATION_REQUEST_CHANGE`, free if > 24 h before start, otherwise the
    cancellation fee applies) and is regenerated under the new pattern; earlier and already collected reservations are untouched.
    On rejection, the request returns to `APPROVED` unchanged.
    **Cancel** (explicit behaviour): `POST /v1/reservation-requests/REQ-44/cancel {"effective_from":"2026-12-08"}` cancels all
    `CONFIRMED` reservations from that date on with the normal 24-hour fee rule (per reservation, listed in the response);
    reservations before that date and rentals in progress are kept.

    ## W5 – Resident disputes the late-return fee; support grants a partial credit
    1. `GET /v1/invoices/INV-5011` → 200 (the owner). Another resident gets `404 NOT_FOUND`; a technician gets `403 ROLE_NOT_PERMITTED`.
    2. ```
       POST /v1/disputes   Idempotency-Key: ...
       { "invoice_id":"INV-5011","line_item_id":"LI-5011-4","disputed_amount_minor":1500,
         "reason_code":"LATE_FEE_INCORRECT","explanation":"I queued 40 minutes at HUB-02 before check-in." }
       → 201 Created  Location: /v1/disputes/DSP-301   { "status":"OPEN", ... }
       ```
       Errors: second open dispute on the same line → `409 DISPUTE_ALREADY_OPEN`; amount > line amount → `422 AMOUNT_EXCEEDS_LINE`; > 60 days → `422 DISPUTE_WINDOW_CLOSED`.
    3. Support agent: `POST /v1/disputes/DSP-301/start-review` → `UNDER_REVIEW`.
    4. Support agent verifies the queue camera log (30 min confirmed) and grants **half** of the fee:
       ```
       POST /v1/disputes/DSP-301/resolve   Idempotency-Key: ...
       { "decision":"PARTIALLY_ACCEPTED","credit_amount_minor":750,"settlement":"REFUND_TO_PAYMENT_METHOD",
         "note":"Queue delay of 30 min verified; remaining 60 min late fee stands." }
       → 200 OK
       { "dispute_id":"DSP-301","status":"RESOLVED",
         "resolution":{"decision":"PARTIALLY_ACCEPTED","credited_amount_minor":750,"credit_note_id":"CN-902", ...} }
       ```
    **Resulting state:** INV-5011 unchanged (`total_minor: 5050`, same line items). New immutable credit note CN-902
    (`-750`, linked to INV-5011, line LI-5011-4 and DSP-301). `GET /v1/invoices/INV-5011` shows `credit_notes: [CN-902]`
    and the derived `net_amount_minor: 4300`. A second resolve (new key) → `409 INVALID_STATE_TRANSITION`; a retry with the
    same key replays the 200 and does not create a second credit note.

    ## Safe retry of a timed-out write (reservation)
    1. The app generates `Idempotency-Key: 7b9e2a41-3d6f-4c81-a9e0-112233445566` when the user taps *Reserve* and stores it with the draft.
    2. `POST /v1/reservations` → the server commits RES-555, but the response is lost (timeout).
    3. The app retries **the same body with the same key** (exponential backoff). The server finds the stored outcome and returns
       `201 Created`, `Location: /v1/reservations/RES-555`, `Idempotent-Replayed: true`. There is no second allocation, so the
       retry cannot fail with `409` against its own booking and does not count twice toward the limit of 2.
    4. If the retry arrives while the first request is still running → `409 IDEMPOTENCY_IN_PROGRESS` + `Retry-After: 1`.
    5. If the app (wrongly) sends a different body with that key → `422 IDEMPOTENCY_KEY_REUSED`.
    6. If the key expired (> 24 h), the app first checks `GET /v1/reservations?status=CONFIRMED&start_from=...`.
    The same mechanism protects charges: check-in (invoice) and dispute resolution (credit note).

    ---

    # 5. Lifecycles

    ## Reservation
    ```
                 ┌──────────────► EXPIRED     (system, start+15 min, no checkout)
    CONFIRMED ───┼──────────────► CHECKED_OUT (operator: POST /rentals with reservation_id)
                 └──────────────► CANCELLED   (customer / coordinator / system)
    ```
    | From | To | Trigger | Who |
    |---|---|---|---|
    | – | `CONFIRMED` | `POST /v1/reservations` | Resident, Org member (own) |
    | – | `CONFIRMED` | `POST /v1/reservation-requests/{id}/approve` | Coordinator (system creates them) |
    | `CONFIRMED` | `CHECKED_OUT` | `POST /v1/rentals` with `reservation_id` | Hub operator assigned to pickup hub |
    | `CONFIRMED` | `EXPIRED` | not collected by `collect_by` (start + 15 min); no-show fee invoice | System |
    | `CONFIRMED` | `CANCELLED` | `POST /v1/reservations/{id}/cancel`: free ≥ 24 h before start, else fee unless `service_outage_id` | Owner resident; org member (org reservation); Support agent (on customer's behalf) |
    | `CONFIRMED` | `CANCELLED` | request amended/cancelled, displacement by maintenance/block (free if not reassigned) | Coordinator / System |

    `CHECKED_OUT`, `EXPIRED` and `CANCELLED` are terminal. A substitute bike at checkout does not change the reservation state.

    ## Rental
    | From | To | Trigger | Who |
    |---|---|---|---|
    | – | `ACTIVE` | `POST /v1/rentals` (with or without reservation; identity check + condition report mandatory) | Hub operator assigned to pickup hub |
    | `ACTIVE` | `ACTIVE` (new `due_at`) | `POST /v1/rentals/{id}/extensions`, only before `due_at`, only if bike + equipment are free for the extension | Owner (resident/org member), hub operator |
    | `ACTIVE` | `OVERDUE` | `due_at` passes | System |
    | `ACTIVE` / `OVERDUE` | `RETURNED` | `POST /v1/rentals/{id}/checkin` → invoice issued | Hub operator assigned to **return** hub |

    Late return, different hub, damaged/missing equipment are **flags** on a `RETURNED` rental (plus operations follow-ups),
    not separate states. A rental always ends `RETURNED` and always has exactly one rental invoice.
    Supplementary condition reports can be appended afterwards (`POST /v1/rentals/{id}/condition-reports`); reports are never edited.

    ## Fault
    | From | To | Trigger | Who |
    |---|---|---|---|
    | – | `REPORTED` | `POST /v1/faults` | Technician, Hub operator (assigned hub), Coordinator |
    | `REPORTED` | `IN_PROGRESS` | `POST /v1/faults/{id}/start-work` | Technician |
    | `REPORTED` / `IN_PROGRESS` | `RESOLVED` | `POST /v1/faults/{id}/resolve` (`FIXED`, `NOT_REPRODUCIBLE`, `DUPLICATE`) | Technician |

    While a `CRITICAL` fault is `REPORTED`/`IN_PROGRESS`, the bike is excluded from availability **and** checkout
    (immediately, same transaction). Future reservations on it are reassigned to an equivalent bike when possible,
    otherwise flagged in the operator queue and an outage record makes cancellation free for the customer.
    Resolving recalculates the bike's `technical_status` (other faults, maintenance, battery still apply); it never
    modifies condition reports, rentals, invoices or disputes. `RESOLVED` is terminal; a recurrence is a new fault (`related_fault_id`).

    ## Maintenance window
    | From | To | Trigger | Who |
    |---|---|---|---|
    | – | `SCHEDULED` | `POST /v1/maintenance-windows` (409 if it overlaps reservations/rentals, unless coordinator uses `displacement`) | Technician, Coordinator |
    | `SCHEDULED` | `COMPLETED` | `POST /v1/maintenance-windows/{id}/complete` (frees the remaining time) | Technician |
    | `SCHEDULED` | `CANCELLED` | `POST /v1/maintenance-windows/{id}/cancel` | Technician, Coordinator |

    ## Operational block
    `ACTIVE` → `CANCELLED` (coordinator, `POST /v1/operational-blocks/{id}/cancel`); an `ACTIVE` block whose `end` has passed is reported as `ENDED`.

    ## Reservation request (organisation)
    | From | To | Trigger | Who |
    |---|---|---|---|
    | – | `SUBMITTED` | `POST /v1/reservation-requests` | Org member |
    | `SUBMITTED` | `APPROVED` | `/approve` (creates reservations; 409 if partial and `allow_partial=false`) | Coordinator |
    | `SUBMITTED` | `REJECTED` | `/reject` | Coordinator |
    | `SUBMITTED` | `CANCELLED` | `/cancel` (withdraw; no reservations exist) | Org member of same organisation |
    | `APPROVED` | `AMENDMENT_PENDING` | `PATCH` with `effective_from` | Org member |
    | `AMENDMENT_PENDING` | `APPROVED` | `/approve` (replace future reservations) or `/reject` (discard amendment) | Coordinator |
    | `APPROVED` / `AMENDMENT_PENDING` | `CANCELLED` | `/cancel` with `effective_from` (future reservations cancelled, fee rule per reservation) | Org member, Coordinator |
    | `APPROVED` | `COMPLETED` | last occurrence ended | System |

    ## Dispute
    `OPEN` → `UNDER_REVIEW` (support, `/start-review`) → `RESOLVED` (support, `/resolve` with decision
    `ACCEPTED` / `PARTIALLY_ACCEPTED` / `REJECTED`; credit note for accepted amounts). `OPEN`/`UNDER_REVIEW` → `WITHDRAWN` (owner, `/withdraw`).

    ## Invoice / credit note
    Created directly as `ISSUED`; there are no transitions. Never modified or deleted.

    ---

    # 6. How permissions are enforced
    * **A resident cannot read another resident's invoice.** Every invoice query is scoped in the data layer:
      `WHERE customer_id = :sub` (residents) or `customer_id = :organisation_id` (org members, organisation invoices).
      A non-matching id returns **404** (not 403) so the existence of other customers' invoices is not revealed.
      Collection endpoints never accept a `customer_id` filter from customers. Only `SUPPORT_AGENT` (and
      `OPS_COORDINATOR` read-only for organisation billing) bypass ownership.
    * **An operator cannot act at an unassigned hub.** Checkout checks `hub_id` (and the reservation's pickup hub),
      check-in checks `return_hub_id`, the queue checks the path `hubId` against `assigned_hub_ids` → `403 HUB_NOT_ASSIGNED`.
      The hub is taken from the request **and** cross-checked with the stored resource, so a forged `hub_id` cannot
      be used to act on a rental held at another hub.
    * **A technician cannot change a charge.** No charge-modifying endpoint lists `TECHNICIAN`; the role gate runs before any lookup and
      returns `403 ROLE_NOT_PERMITTED`. Charges only change through new documents (`CreditNote`) created by `SUPPORT_AGENT`.
      Resolving a fault has no financial side effects.
  contact:
    name: UrbanMove API group
servers:
  - url: https://api.urbanmove.city
    description: Production
  - url: https://sandbox.api.urbanmove.city
    description: Sandbox
security:
  - bearerAuth: []
tags:
  - name: Profile
  - name: Attachments
  - name: Hubs
  - name: Fleet
    description: Bikes and equipment (master data). `technical_status`, `battery_pct` and bookability are derived and read-only.
  - name: Availability
    description: Computed read models. Results are snapshots, **not** holds.
  - name: Reservations
  - name: Rentals
    description: Physical custody. Checkout = `POST /v1/rentals`.
  - name: Condition reports
  - name: Faults & maintenance
  - name: Operations
    description: Operational blocks and documented service outages.
  - name: Organisations
  - name: Reservation requests
    description: Recurring organisation requests and their generated occurrences.
  - name: Billing
    description: Immutable invoices and credit notes.
  - name: Disputes

paths:
  # ───────────────────────────── Profile ─────────────────────────────
  /v1/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get own profile
      description: "**Roles:** any authenticated user. Returns only the caller's own data."
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN, SUPPORT_AGENT]
      responses:
        '200':
          description: Profile
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update own profile
      description: "**Roles:** any authenticated user (own profile only). Roles, organisation and hub assignments are not editable here (identity provider)."
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN, SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
            example: { phone: "+49 170 5550123" }
      responses:
        '200':
          description: Updated profile
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ───────────────────────────── Attachments ─────────────────────────────
  /v1/attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload a photo or document
      description: |
        **Roles:** Hub operator, Technician, Resident/Org member (dispute evidence), Support agent.
        Uses `multipart/form-data` (binary upload). The returned `attachment_id` is referenced from condition reports,
        faults and disputes. Max 10 MB; `image/jpeg`, `image/png`, `application/pdf`.
        Attachments are only readable by users who can read the resource that references them.
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, TECHNICIAN, SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Uploaded
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: File too large
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Unsupported file type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────── Hubs ─────────────────────────────
  /v1/hubs:
    get:
      tags: [Hubs]
      operationId: listHubs
      summary: List hubs
      description: "**Roles:** public (no token required). Static hub data only; for availability use `/v1/availability/hub-summaries`."
      security: []
      x-roles: [PUBLIC]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HubStatus' } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
        - { name: radius_km, in: query, schema: { type: number, minimum: 0.1, maximum: 50 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of hubs
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Hubs]
      operationId: createHub
      summary: Create hub
      description: "**Roles:** Operations coordinator."
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubCreate' }
            example:
              name: Hauptbahnhof Nord
              address: Bahnhofplatz 1
              location: { lat: 52.5251, lng: 13.3694 }
              opening_hours: "Mo-Su 06:00-22:00"
              parking_slots: 12
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hub' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/hubs/{hubId}:
    parameters:
      - $ref: '#/components/parameters/HubId'
    get:
      tags: [Hubs]
      operationId: getHub
      summary: Get hub
      description: "**Roles:** public."
      security: []
      x-roles: [PUBLIC]
      responses:
        '200':
          description: Hub
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hub' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Hubs]
      operationId: updateHub
      summary: Update hub (incl. deactivate)
      description: |
        **Roles:** Operations coordinator. Setting `status: INACTIVE` is only allowed when no future reservations
        start at the hub (`409 HUB_HAS_FUTURE_RESERVATIONS`); otherwise use an operational block with displacement.
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubPatch' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hub' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/hubs/{hubId}/operator-queue:
    parameters:
      - $ref: '#/components/parameters/HubId'
    get:
      tags: [Hubs]
      operationId: getOperatorQueue
      summary: "Read model: operator work queue for one hub and day"
      description: |
        **Roles:** Hub operator **assigned to `hubId`** (else `403 HUB_NOT_ASSIGNED`); Operations coordinator (any hub).

        Computed view for one hub and one local calendar day: planned pickups, expected returns, overdue rentals
        (including rentals picked up here and overdue anywhere), and bikes/equipment needing attention
        (low battery, open faults incl. critical, maintenance today, returned from another hub, damaged equipment).
        Bikes that are **not bookable** still appear here. Personal data is limited to display name and reference.
      x-roles: [HUB_OPERATOR, OPS_COORDINATOR]
      parameters:
        - name: date
          in: query
          required: true
          description: Local date of the hub (YYYY-MM-DD)
          schema: { type: string, format: date }
          example: "2026-11-20"
        - name: sections
          in: query
          description: Restrict to some sections (default all)
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, enum: [planned_pickups, expected_returns, overdue_rentals, bikes_needing_attention, equipment_needing_attention] }
      responses:
        '200':
          description: Queue
          headers:
            Cache-Control:
              schema: { type: string }
              example: "private, max-age=15"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorQueue' }
              example:
                hub_id: HUB-02
                date: "2026-11-20"
                generated_at: "2026-11-20T12:40:00Z"
                planned_pickups:
                  - { reservation_id: RES-9930, start: "2026-11-20T14:00:00Z", collect_by: "2026-11-20T14:15:00Z", customer_display_name: "J. Novak", bike_id: BIKE-410, equipment_types: [DELIVERY_CRATE], origin: INDIVIDUAL, at_risk: false }
                expected_returns:
                  - { rental_id: RNT-8820, due_at: "2026-11-20T15:00:00Z", bike_id: BIKE-415, customer_display_name: "A. Weber", pickup_hub_id: HUB-02 }
                overdue_rentals:
                  - { rental_id: RNT-8812, due_at: "2026-11-20T12:00:00Z", minutes_overdue: 40, bike_id: BIKE-402, customer_display_name: "M. Schulz", planned_return_hub_id: HUB-01, pickup_hub_id: HUB-01 }
                bikes_needing_attention:
                  - { bike_id: BIKE-417, reasons: [OPEN_CRITICAL_FAULT], battery_pct: 64, open_fault_ids: [FLT-310], bookable: false }
                  - { bike_id: BIKE-419, reasons: [LOW_BATTERY], battery_pct: 18, open_fault_ids: [], bookable: false }
                equipment_needing_attention:
                  - { equipment_id: EQ-RAIN-07, equipment_type: RAIN_COVER, status: DAMAGED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Role not permitted or hub not assigned
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.urbanmove.city/problems/hub-not-assigned
                title: Hub not assigned
                status: 403
                code: HUB_NOT_ASSIGNED
                detail: You are not assigned to hub HUB-02.
                instance: /v1/hubs/HUB-02/operator-queue
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Fleet ─────────────────────────────
  /v1/bikes:
    get:
      tags: [Fleet]
      operationId: listBikes
      summary: List bikes (staff view)
      description: |
        **Roles:** Coordinator, Technician (all hubs); Hub operator (results restricted to assigned hubs; `hub_id` outside → `403 HUB_NOT_ASSIGNED`).
        Shows **all** bikes including non-bookable ones with `unavailability_reasons`. Customers use `/v1/availability/*` instead.
      x-roles: [HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN]
      parameters:
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: technical_status, in: query, schema: { $ref: '#/components/schemas/TechnicalStatus' } }
        - { name: bookable_now, in: query, schema: { type: boolean } }
        - { name: bike_type, in: query, schema: { $ref: '#/components/schemas/BikeType' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of bikes
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BikePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fleet]
      operationId: createBike
      summary: Add bike to fleet
      description: "**Roles:** Operations coordinator."
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BikeCreate' }
            example: { bike_type: LONG_JOHN, model: UrbanCargo Heavy 200, load_capacity_kg: 120, accessibility_features: [STEP_THROUGH_FRAME], hub_id: HUB-01 }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bike' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/bikes/{bikeId}:
    parameters:
      - $ref: '#/components/parameters/BikeId'
    get:
      tags: [Fleet]
      operationId: getBike
      summary: Get bike (staff view)
      description: "**Roles:** Coordinator, Technician; Hub operator only for bikes currently at an assigned hub (else 404)."
      x-roles: [HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN]
      responses:
        '200':
          description: Bike
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bike' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Fleet]
      operationId: updateBike
      summary: Update bike master data, relocate or retire
      description: |
        **Roles:** Operations coordinator. `technical_status`, `battery_pct` and bookability are derived and cannot be set.
        Relocating (`hub_id`) or retiring a bike with future allocations → `409 BIKE_HAS_FUTURE_ALLOCATIONS`.
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BikePatch' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bike' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/equipment:
    get:
      tags: [Fleet]
      operationId: listEquipment
      summary: List equipment items (staff view)
      description: "**Roles:** Coordinator, Technician; Hub operator (assigned hubs only)."
      x-roles: [HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN]
      parameters:
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: equipment_type, in: query, schema: { $ref: '#/components/schemas/EquipmentType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EquipmentStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of equipment
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fleet]
      operationId: createEquipment
      summary: Add equipment item to a hub
      description: "**Roles:** Operations coordinator."
      x-roles: [OPS_COORDINATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentCreate' }
            example: { equipment_type: CHILD_SEAT, hub_id: HUB-01, label: "Child seat #14" }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Equipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentId'
    get:
      tags: [Fleet]
      operationId: getEquipment
      summary: Get equipment item
      description: "**Roles:** Coordinator, Technician; Hub operator (assigned hubs only, else 404)."
      x-roles: [HUB_OPERATOR, OPS_COORDINATOR, TECHNICIAN]
      responses:
        '200':
          description: Equipment
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Equipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Fleet]
      operationId: updateEquipment
      summary: Relocate, repair or retire equipment
      description: |
        **Roles:** Coordinator (`hub_id`, `status` → `RETIRED`); Technician (`status` `DAMAGED` → `AVAILABLE` after repair, `MISSING` → `AVAILABLE` when found).
        `IN_USE` is set only by checkout/check-in. Relocation with future allocations → `409 EQUIPMENT_HAS_FUTURE_ALLOCATIONS`.
      x-roles: [OPS_COORDINATOR, TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentPatch' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Equipment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ───────────────────────────── Availability (views) ─────────────────────────────
  /v1/availability/hub-summaries:
    get:
      tags: [Availability]
      operationId: listHubAvailabilitySummaries
      summary: "Read model: customer map – bookable bike count per type and hub"
      description: |
        **Roles:** public (no token). Lightweight, paginated, filterable, cacheable (`Cache-Control: public, max-age=30`).
        Counts only bikes that are **bookable for the whole window** with all filters applied: never bikes that are merely parked.
        Contains no bike IDs and no personal data. Default window: now → now + 2 h.
      security: []
      x-roles: [PUBLIC]
      parameters:
        - { name: lat, in: query, schema: { type: number, format: double }, description: "Centre; required together with lng unless bbox is given" }
        - { name: lng, in: query, schema: { type: number, format: double } }
        - { name: radius_km, in: query, schema: { type: number, default: 3, minimum: 0.1, maximum: 25 } }
        - name: bbox
          in: query
          description: "Alternative to lat/lng/radius: minLng,minLat,maxLng,maxLat"
          schema: { type: string }
          example: "13.30,52.48,13.45,52.56"
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { name: bike_type, in: query, schema: { $ref: '#/components/schemas/BikeType' } }
        - { name: min_load_capacity_kg, in: query, schema: { type: integer, minimum: 0 } }
        - name: accessibility_features
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        - { name: min_range_km, in: query, schema: { type: integer, minimum: 0 } }
        - name: equipment_types
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EquipmentType' } }
        - { name: only_with_availability, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of hub summaries, ordered by distance
          headers:
            Link: { $ref: '#/components/headers/Link' }
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=30"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubAvailabilitySummaryPage' }
              example:
                items:
                  - hub_id: HUB-01
                    name: Hauptbahnhof Nord
                    location: { lat: 52.5251, lng: 13.3694 }
                    distance_km: 0.4
                    window: { start: "2026-11-20T09:00:00Z", end: "2026-11-20T12:00:00Z" }
                    bikes_available: [ { bike_type: LONG_JOHN, count: 3 }, { bike_type: TRIKE, count: 1 } ]
                    equipment_available: [ { equipment_type: CHILD_SEAT, count: 2 }, { equipment_type: RAIN_COVER, count: 4 } ]
                next_cursor: "eyJvZmYiOiJIVUItMDEifQ"
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/availability/bikes:
    get:
      tags: [Availability]
      operationId: searchEligibleBikes
      summary: "Read model: eligible bikes and equipment at one hub for a period"
      description: |
        **Roles:** Resident, Org member, Hub operator (walk-in at assigned hub), Coordinator.
        Returns only bikes satisfying **all** rules for the **complete** period (see assumption 3) and equipment items
        free for the complete period at that hub. The result is a snapshot (`is_binding: false`): reserving may still return `409`.
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR]
      parameters:
        - { name: hub_id, in: query, required: true, schema: { type: string }, example: HUB-01 }
        - { name: start, in: query, required: true, schema: { type: string, format: date-time }, example: "2026-11-20T09:00:00Z" }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, example: "2026-11-20T12:00:00Z" }
        - { name: bike_type, in: query, schema: { $ref: '#/components/schemas/BikeType' } }
        - { name: min_load_capacity_kg, in: query, schema: { type: integer, minimum: 0 }, example: 80 }
        - name: accessibility_features
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/AccessibilityFeature' } }
        - { name: min_range_km, in: query, schema: { type: integer, minimum: 0 }, example: 30 }
        - name: equipment_types
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/EquipmentType' } }
          example: [CHILD_SEAT, RAIN_COVER]
      responses:
        '200':
          description: Eligible bikes and equipment
          headers:
            Cache-Control:
              schema: { type: string }
              example: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EligibleBikesResult' }
              example:
                hub_id: HUB-01
                start: "2026-11-20T09:00:00Z"
                end: "2026-11-20T12:00:00Z"
                is_binding: false
                generated_at: "2026-11-18T17:02:11Z"
                bikes:
                  - { bike_id: BIKE-402, bike_type: LONG_JOHN, model: UrbanCargo Heavy 200, load_capacity_kg: 120, accessibility_features: [STEP_THROUGH_FRAME], battery_pct: 92, estimated_range_km: 55, price_estimate_minor: 1500, currency: EUR }
                equipment:
                  - { equipment_id: EQ-CHILD-01, equipment_type: CHILD_SEAT }
                  - { equipment_id: EQ-RAIN-02, equipment_type: RAIN_COVER }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Reservations ─────────────────────────────
  /v1/reservations:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations
      description: |
        **Roles & scope:** Resident → own only; Org member → own + their organisation's (`scope=organisation`);
        Hub operator → reservations with pickup at assigned hubs; Coordinator, Support agent → all (may filter by `customer_id`).
        Customers cannot use `customer_id` (ignored → 400 if supplied).
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, SUPPORT_AGENT]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReservationStatus' } }
        - { name: scope, in: query, schema: { type: string, enum: [own, organisation], default: own } }
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: customer_id, in: query, schema: { type: string }, description: Staff only }
        - { name: start_from, in: query, schema: { type: string, format: date-time } }
        - { name: start_to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of reservations
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Reserve a bike (and optional equipment)
      description: |
        **Roles:** Resident, Org member (for themselves). Atomic: the bike and every equipment item are allocated for the
        complete period in one transaction or nothing is (see W1, W3). Re-validates eligibility server-side;
        never trusts the earlier search. Requires `Idempotency-Key` (see *Safe retry*).
      x-roles: [RESIDENT, ORG_MEMBER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
            example:
              bike_id: BIKE-402
              pickup_hub_id: HUB-01
              planned_return_hub_id: HUB-01
              start: "2026-11-20T09:00:00Z"
              end: "2026-11-20T12:00:00Z"
              equipment_ids: [EQ-CHILD-01, EQ-RAIN-02]
              requirements: { min_load_capacity_kg: 80, accessibility_features: [STEP_THROUGH_FRAME], min_range_km: 30 }
      responses:
        '201':
          description: Reservation confirmed (example success response 1)
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                reservation_id: RES-9901
                status: CONFIRMED
                origin: INDIVIDUAL
                customer: { type: RESIDENT, id: USR-1001 }
                booked_by: USR-1001
                request_id: null
                bike_id: BIKE-402
                pickup_hub_id: HUB-01
                planned_return_hub_id: HUB-01
                start: "2026-11-20T09:00:00Z"
                end: "2026-11-20T12:00:00Z"
                collect_by: "2026-11-20T09:15:00Z"
                free_cancellation_until: "2026-11-19T09:00:00Z"
                equipment: [ { equipment_id: EQ-CHILD-01, equipment_type: CHILD_SEAT }, { equipment_id: EQ-RAIN-02, equipment_type: RAIN_COVER } ]
                requirements: { min_load_capacity_kg: 80, accessibility_features: [STEP_THROUGH_FRAME], min_range_km: 30 }
                rental_id: null
                cancellation: null
                created_at: "2026-11-18T17:03:40Z"
                links: { self: /v1/reservations/RES-9901, cancel: /v1/reservations/RES-9901/cancel }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflict with current state (example error response 1)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                assetUnavailable:
                  summary: Lost the race for the last bike (W3)
                  value:
                    type: https://api.urbanmove.city/problems/asset-unavailable
                    title: Asset no longer available
                    status: 409
                    code: ASSET_UNAVAILABLE
                    detail: BIKE-77 was reserved by another customer for an overlapping period.
                    instance: /v1/reservations
                    trace_id: 4bf92f3577b34da6
                    conflicting_assets: [BIKE-77]
                    alternatives_href: /v1/availability/bikes?hub_id=HUB-04&start=2026-11-21T14:00:00Z&end=2026-11-21T16:00:00Z
                limitReached:
                  summary: Third active reservation
                  value:
                    type: https://api.urbanmove.city/problems/reservation-limit-reached
                    title: Reservation limit reached
                    status: 409
                    code: RESERVATION_LIMIT_REACHED
                    detail: You already hold 2 active reservations (RES-9901, RES-9910).
                    instance: /v1/reservations
                idempotencyInProgress:
                  summary: Retry while original still running
                  value:
                    type: https://api.urbanmove.city/problems/idempotency-in-progress
                    title: Request still in progress
                    status: 409
                    code: IDEMPOTENCY_IN_PROGRESS
                    detail: A request with this Idempotency-Key is still being processed. Retry later.
        '422':
          description: Business rule violation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notEligible:
                  value:
                    type: https://api.urbanmove.city/problems/bike-not-eligible
                    title: Bike not eligible
                    status: 422
                    code: BIKE_NOT_ELIGIBLE
                    detail: BIKE-405 does not meet the requested load capacity (60 kg < 80 kg).
                    instance: /v1/reservations
                    errors: [ { field: bike_id, code: CAPACITY_TOO_LOW, message: "60 kg < 80 kg" } ]
                keyReused:
                  value:
                    type: https://api.urbanmove.city/problems/idempotency-key-reused
                    title: Idempotency key reused
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: This Idempotency-Key was already used with a different request body.
  /v1/reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: "Read model: detailed reservation/rental view with condition reports, charges and allowed next actions"
      description: |
        **Roles & scope:** owner Resident; Org member for own or their organisation's reservations; Hub operator at the pickup hub;
        Coordinator; Support agent. Others → `404`.
        Aggregates the reservation, its rental (if collected), all condition reports, invoices/credit notes and
        `allowed_actions` computed for **this caller and this state** (e.g. `CANCEL` with fee preview, `EXTEND_RENTAL`, `OPEN_DISPUTE`).
        Clients render buttons from `allowed_actions` instead of re-implementing rules.
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, SUPPORT_AGENT]
      responses:
        '200':
          description: Reservation detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
              example:
                reservation_id: RES-9901
                status: CHECKED_OUT
                origin: INDIVIDUAL
                customer: { type: RESIDENT, id: USR-1001 }
                booked_by: USR-1001
                bike: { bike_id: BIKE-402, bike_type: LONG_JOHN, model: UrbanCargo Heavy 200, load_capacity_kg: 120 }
                pickup_hub_id: HUB-01
                planned_return_hub_id: HUB-01
                start: "2026-11-20T09:00:00Z"
                end: "2026-11-20T12:00:00Z"
                collect_by: "2026-11-20T09:15:00Z"
                equipment: [ { equipment_id: EQ-CHILD-01, equipment_type: CHILD_SEAT }, { equipment_id: EQ-RAIN-02, equipment_type: RAIN_COVER } ]
                rental:
                  rental_id: RNT-8812
                  status: RETURNED
                  started_at: "2026-11-20T09:05:00Z"
                  due_at: "2026-11-20T12:00:00Z"
                  returned_at: "2026-11-20T13:30:00Z"
                  return_hub_id: HUB-02
                  flags: [LATE_RETURN, DIFFERENT_RETURN_HUB, EQUIPMENT_DAMAGED]
                condition_reports:
                  - { condition_report_id: CR-1, kind: CHECKOUT, recorded_at: "2026-11-20T09:05:00Z", hub_id: HUB-01, battery_pct: 95, bike_condition: GOOD, equipment: [ { equipment_id: EQ-CHILD-01, status: OK }, { equipment_id: EQ-RAIN-02, status: OK } ] }
                  - { condition_report_id: CR-2, kind: CHECKIN, recorded_at: "2026-11-20T13:30:00Z", hub_id: HUB-02, battery_pct: 20, bike_condition: GOOD, equipment: [ { equipment_id: EQ-CHILD-01, status: OK }, { equipment_id: EQ-RAIN-02, status: DAMAGED, notes: Torn side seam } ] }
                charges:
                  currency: EUR
                  invoices: [ { invoice_id: INV-5011, total_minor: 5050, net_amount_minor: 5050, issued_at: "2026-11-20T13:30:02Z" } ]
                  credit_notes: []
                  open_dispute_ids: []
                allowed_actions:
                  - { action: OPEN_DISPUTE, method: POST, href: /v1/disputes, note: "Possible until 2027-01-19" }
                  - { action: VIEW_INVOICE, method: GET, href: /v1/invoices/INV-5011 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/reservations/{reservationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel a reservation (state transition)
      description: |
        **Roles:** owner Resident; Org member (own or organisation reservation); Support agent (on the customer's behalf, reason required).
        Only from `CONFIRMED`. Free when `now < start − 24 h`. Later: allowed, but a cancellation-fee invoice is issued unless
        `reason = SERVICE_OUTAGE` with a `service_outage_id` that covers this reservation's hub/bike and time.
        The fee to expect is shown beforehand in `allowed_actions[].fee_preview_minor`.
      x-roles: [RESIDENT, ORG_MEMBER, SUPPORT_AGENT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCancel' }
            examples:
              free: { value: { reason: CUSTOMER_REQUEST } }
              outage: { value: { reason: SERVICE_OUTAGE, service_outage_id: OUT-17, comment: "Hub closed due to flooding" } }
      responses:
        '200':
          description: Cancelled
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                reservation_id: RES-9915
                status: CANCELLED
                cancellation: { cancelled_at: "2026-11-21T08:00:00Z", cancelled_by: USR-1001, reason: CUSTOMER_REQUEST, late: true, fee_minor: 500, currency: EUR, fee_invoice_id: INV-5020 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Not in CONFIRMED (`INVALID_STATE_TRANSITION`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "Outage does not cover this reservation (`OUTAGE_NOT_APPLICABLE`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────── Rentals ─────────────────────────────
  /v1/rentals:
    get:
      tags: [Rentals]
      operationId: listRentals
      summary: List rentals
      description: |
        **Roles & scope:** Resident → own; Org member → own + organisation's; Hub operator → rentals picked up or due back at assigned hubs;
        Coordinator, Support agent → all.
      x-roles: [RESIDENT, ORG_MEMBER, HUB_OPERATOR, OPS_COORDINATOR, SUPPORT_AGENT]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RentalStatus' } }
        - { name: hub_id, in: query, schema: { type: string } }
        - { name: flag, in: query, schema: { $ref: '#/components/schemas/RentalFlag' } }
        - { name: customer_id, in: query, schema: { type: string }, description: Staff only }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of rentals
          headers:
            Link: { $ref: '#/components/headers/Link' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Rentals]
      operationId: checkoutRental
      summary: Check out (start a rental), with or without a reservation
      description: |
        **Roles:** Hub operator assigned to `hub_id` (= the reservation's pickup hub when a reservation is given).
        Requires an identity check and a condition report. Atomic with the reservation transition `CONFIRMED → CHECKED_OUT`.

        * **With reservation:** `reservation_id`, must be `CONFIRMED` and `now ≤ collect_by`. Bike/equipment/due time come from it.
          `bike_id` may name a substitute if the reserved bike became unavailable; it must meet the reservation's requirements.
        * **Walk-in (no reservation):** `customer_id`, `bike_id`, `due_at`, optional `equipment_ids`; the bike/equipment must be
          eligible and free from now until `due_at` (same allocation rules as reservations → `409 ASSET_UNAVAILABLE`).

        A bike with an open critical fault, maintenance window, block or low battery cannot be checked out (`409 BIKE_NOT_CHECKOUTABLE`).
      x-roles: [HUB_OPERATOR]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
            examples:
              withReservation:
                summary: W2 checkout
                value:
                  reservation_id: RES-9901
                  hub_id: HUB-01
                  identity_check: { method: ID_CARD, verified: true, document_reference_last4: "4471" }
                  condition_report:
                    battery_pct: 95
                    bike_condition: GOOD
                    equipment: [ { equipment_id: EQ-CHILD-01, status: OK }, { equipment_id: EQ-RAIN-02, status: OK } ]
              walkIn:
                summary: Walk-in rental without reservation
                value:
                  customer_id: USR-1044
                  hub_id: HUB-01
                  bike_id: BIKE-406
                  due_at: "2026-11-20T16:00:00Z"
                  planned_return_hub_id: HUB-01
                  equipment_ids: [EQ-CRATE-03]
                  identity_check: { method: APP_QR, verified: true }
                  condition_report: { battery_pct: 81, bike_condition: MINOR_WEAR, notes: "Scratch on left side", equipment: [ { equipment_id: EQ-CRATE-03, status: OK } ] }
      responses:
        '201':
          description: Rental started
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
              example:
                rental_id: RNT-8812
                status: ACTIVE
                reservation_id: RES-9901
                customer: { type: RESIDENT, id: USR-1001 }
                bike_id: BIKE-402
                pickup_hub_id: HUB-01
                planned_return_hub_id: HUB-01
                return_hub_id: null
                started_at: "2026-11-20T09:05:00Z"
