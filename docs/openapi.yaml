      description: "**Roles:** Org member of this organisation (else 404); Coordinator; Support agent. Membership is managed in the identity provider."
      x-roles: [ORG_MEMBER, OPS_COORDINATOR, SUPPORT_AGENT]
      responses:
        '200':
          description: Organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organisation' }
